<script>
/* ===== 先生の じゅぎょう プレーヤー ===== */
const PHASES=['はじまり','{思|おも}い{出|だ}す','めあて','せつめい','やってみよう','たしかめ','れんしゅう','まとめ'];
function speak(text,en){return new Promise(res=>{let done=false;const fin=()=>{if(!done){done=true;res();}};
 const plain=en?text:SPK(text);const est=Math.max(1200,plain.length*(en?110:170));
 try{if(!('speechSynthesis' in window))throw 0;speechSynthesis.cancel();const u=new SpeechSynthesisUtterance(plain);u.lang=en?'en-US':'ja-JP';u.rate=en?.8:.9;u.onend=fin;u.onerror=fin;speechSynthesis.speak(u);setTimeout(fin,est+4000);}catch(e){setTimeout(fin,est);}});}
let LP=null;
function lesson(sec,onDone,exitFn){LP={sec,ph:0,onDone:onDone||home,exit:exitFn||home,gate:{streak:0,tries:0,wrongRow:0}};MODE='study';phase();}
function phaseBar(){return `<div class="phase">${PHASES.map((p,i)=>`<span class="${i<LP.ph?'done':i===LP.ph?'now':''}">${R(p)}</span>`).join('')}</div>`;}
function lhead(){const sc=SEC[LP.sec],c=CH[chIdx(sc.ch)];return `<div class="topbar">${back('やめる')}<b style="color:${c.color}">${R(sc.title)}</b><span></span></div>${phaseBar()}`;}
function nextPhase(){LP.ph++;phase();}
function phase(){MODE='study';try{speechSynthesis.cancel();}catch(e){}const sc=SEC[LP.sec],ls=LS[LP.sec]||{},c=CH[chIdx(sc.ch)];
 const p=LP.ph;
 if(p===0){if(ls.hook)playScript([ls.hook],nextPhase);else nextPhase();}
 else if(p===1){const prev=prevSec(LP.sec);if(!prev){nextPhase();return;}
  app.innerHTML=lhead()+`<div class="goalcard" style="--ac:${c.color}"><div class="disp">${R('まえに {学|まな}んだ ことを {思|おも}い{出|だ}そう')}</div><p>${R(SEC[prev].title)}</p><button class="btn primary" id="go">1{問|もん} ためす</button> <button class="btn ghost" id="skip">とばす</button></div>`;
  bindBack(LP.exit);speak(P('まえに 学んだ ことを 思い出そう。'));
  $('#skip').onclick=nextPhase;
  $('#go').onclick=()=>{const q=Object.assign(GEN[prev](2),{sec:prev});runSet({title:'{思|おも}い{出|だ}そう',qs:[q],color:c.color,back:LP.exit,onAnswer:()=>nextPhase()});};}
 else if(p===2){app.innerHTML=lhead()+`<div class="goalcard" style="--ac:${c.color}"><div class="muted">きょうの めあて</div><div class="disp">${R(sc.goal)}</div><div style="width:110px;margin:10px auto">${OWL()}</div><button class="btn primary" id="go">はじめよう!</button></div>`;
  bindBack(LP.exit);speak('きょうの めあて。'+P(sc.goal));$('#go').onclick=nextPhase;}
 else if(p===3){if(ls.teach&&ls.teach.length)playScript(ls.teach,nextPhase);else nextPhase();}
 else if(p===4){tryPages(0);}
 else if(p===5){gateIntro();}
 else if(p===6){runSet({title:'れんしゅう',qs:makeQs([LP.sec],5),color:c.color,back:LP.exit,onDone:nextPhase});}
 else if(p===7){wrap();}
}
function prevSec(sec){const s=subjOf(sec),L=subjSecs(s),i=L.indexOf(sec);return i>0?L[i-1]:null;}
/* せつめい(アニメ + 先生の声) */
function playScript(scenes,onEnd){let si=0,li=0,scn=null,auto=S.autoplay!==false,busy=false;const tok={};LP.tok=tok;
 const render=()=>{const sp=scenes[si];app.innerHTML=lhead()+`<div class="lstage" id="stg"></div>
  <div class="teacher"><div class="face">${OWL()}</div><div class="bub" id="bub"></div></div>
  <div class="lnav"><button class="btn small ghost" id="again">${R('もう{一度|いちど}')}</button><span class="muted" id="cnt"></span><button class="btn primary" id="nx">つぎへ</button></div>
  <div class="row center" style="margin-top:8px"><label class="muted"><input type="checkbox" id="au" ${auto?'checked':''}> ${R('じどうで すすむ')}</label></div>`;
  bindBack(LP.exit);$$('[data-back]').forEach(b=>b.addEventListener('click',()=>{LP.tok=null;try{speechSynthesis.cancel();}catch(e){}}));
  scn=Scene($('#stg'),sp.sc);li=0;
  $('#again').onclick=()=>{if(scn)scn.stop();render();};
  $('#nx').onclick=()=>{if(busy){try{speechSynthesis.cancel();}catch(e){}}step(true);};
  $('#au').onchange=e=>{auto=e.target.checked;S.autoplay=auto;save();};
  step();};
 const step=(manual)=>{if(!LP||LP.tok!==tok||!$('#bub'))return;const sp=scenes[si];
  if(li>=sp.lines.length){if(si<scenes.length-1){si++;render();return;}
   $('#bub').innerHTML=R('わかったかな? {次|つぎ}に すすもう!');$('#nx').textContent='つぎへ';$('#nx').onclick=()=>{LP.tok=null;onEnd();};return;}
  let line=sp.lines[li++];let act=null,q=false,en=false;
  if(line[0]==='!'){const m=line.match(/^!([A-Za-z0-9_*]+)\s*(.*)$/);act=m[1];line=m[2];}
  if(line[0]==='?'){q=true;line=line.slice(1);}if(line[0]==='@'){en=true;line=line.slice(1);}
  if(act)scn.act(act);
  const bub=$('#bub');bub.className='bub'+(q?' q':'');bub.innerHTML=en?`<span style="font-size:1.3em">${esc(line)}</span>`:R(line);
  $('#cnt').textContent=`${si+1}-${li}/${sp.lines.length}`;busy=true;
  speak(en?line:line,en).then(()=>{busy=false;if(!LP||LP.tok!==tok||!$('#bub'))return;
   if(q){bub.insertAdjacentHTML('beforeend',`<span class="think">${'<i></i>'.repeat(4)}</span>`);const is=bub.querySelectorAll('.think i');let k=0;const iv=setInterval(()=>{if(k<4)is[k++].classList.add('on');else{clearInterval(iv);}},900);
    $('#nx').innerHTML=R('{考|かんが}えた!');$('#nx').onclick=()=>{clearInterval(iv);$('#nx').textContent='つぎへ';$('#nx').onclick=()=>step(true);step(true);};return;}
   if(auto)setTimeout(()=>{if(LP.tok===tok&&!busy)step();},700);});};
 render();}
/* やってみよう(さわって ためす) */
function tryPages(pg){const sc=SEC[LP.sec],c=CH[chIdx(sc.ch)],pages=sc.pages;if(!pages||!pages.length){nextPhase();return;}
 const last=pg===pages.length-1;
 app.innerHTML=lhead()+`<div class="book" style="--ac:${c.color};min-height:0"><div class="eyebrow">やってみよう ${pg+1}/${pages.length}</div><div id="bk" class="stack"></div>
 <div class="bnav">${pg>0?'<button class="btn" id="prev">まえへ</button>':'<span></span>'}<button class="btn primary" id="nx">つぎへ</button></div></div>`;
 bindBack(LP.exit);const bk=$('#bk');let need=0,got=0;const nx=$('#nx');const upd=()=>{nx.disabled=got<need;};
 pages[pg].forEach(bl=>{const el=document.createElement('div');bk.appendChild(el);renderBlock(bl,el,()=>{got++;upd();});if(bl[0]==='quiz')need++;});upd();
 if(pg>0)$('#prev').onclick=()=>tryPages(pg-1);
 nx.onclick=()=>{if(!last)tryPages(pg+1);else nextPhase();};window.scrollTo(0,0);}
/* たしかめ(わかるまで すすまない) */
function gateIntro(){const c=CH[chIdx(SEC[LP.sec].ch)];const g=LP.gate;
 app.innerHTML=lhead()+`<div class="goalcard" style="--ac:${c.color}"><div class="disp">${R('わかったか たしかめよう')}</div><p>${R('3{問|もん} つづけて 1{回|かい}で せいかい できたら ごうかく!')}</p><div class="row center">${[0,1,2].map(i=>`<span style="width:44px;display:inline-block">${STAR(i<g.streak)}</span>`).join('')}</div><button class="btn primary" id="go">はじめる</button></div>`;
 bindBack(LP.exit);speak(P('わかったか たしかめよう。3問 つづけて 1回で せいかい できたら ごうかく。'));$('#go').onclick=gateQ;}
function gateQ(){const c=CH[chIdx(SEC[LP.sec].ch)],g=LP.gate;g.tries++;
 const q=Object.assign(GEN[LP.sec](Math.min(4,1+g.tries%4)),{sec:LP.sec});
 runSet({title:`たしかめ (${g.streak}/3)`,qs:[q],color:c.color,back:LP.exit,onAnswer:(ok,first)=>{
  if(ok&&first){g.streak++;g.wrongRow=0;}else{g.streak=0;g.wrongRow++;}
  if(g.streak>=3){SND.fan();app.innerHTML=lhead()+`<div class="result"><div style="width:120px">${OWL()}</div><h2>ごうかく!</h2><p>${R('しっかり わかったね。つぎは れんしゅうだよ。')}</p><button class="btn go" id="go">つぎへ</button></div>`;bindBack(LP.exit);speak('ごうかく! しっかり わかったね。');$('#go').onclick=nextPhase;return;}
  if(g.tries>=12){app.innerHTML=lhead()+`<div class="result"><h2>${R('きょうは ここまで')}</h2><p>${R('まだ すこし むずかしいね。だいじょうぶ、あしたも いっしょに れんしゅう しよう。')}</p><button class="btn go" id="go">つぎへ</button></div>`;bindBack(LP.exit);LP.hard=true;$('#go').onclick=nextPhase;return;}
  if(!ok||!first){const sp=LS[LP.sec];
   app.innerHTML=lhead()+`<div class="result"><div style="width:110px">${OWL()}</div><h2>${R(g.wrongRow>=2?'もう{一度|いちど} せつめいを {見|み}よう':'おしい! だいじょうぶ')}</h2><p>${R(g.wrongRow>=2?'ちがう {見|み}かたで せつめいするよ。':'まちがいは わかる ための ヒント。もう{一度|いちど} ちょうせん しよう。')}</p>
   <div class="row center">${sp&&sp.teach?`<button class="btn ${g.wrongRow>=2?'primary':'ghost'}" id="re">${R('せつめいを {見|み}る')}</button>`:''}<button class="btn ${g.wrongRow>=2?'ghost':'primary'}" id="again">${R('もう{一度|いちど} ちょうせん')}</button></div></div>`;
   bindBack(LP.exit);
   if($('#re'))$('#re').onclick=()=>{g.wrongRow=0;playScript(sp.teach.concat(sp.alt||[]),()=>{LP.ph=5;gateIntro();});};
   $('#again').onclick=gateQ;speak(g.wrongRow>=2?'もう一度 説明を 見よう。':'おしい! もう一度 ちょうせん しよう。');return;}
  gateQ();}});}
/* まとめ・ふりかえり */
function wrap(){const sc=SEC[LP.sec],c=CH[chIdx(sc.ch)];const pts=(sc.pages||[]).flat().filter(b=>b[0]==='point');
 const nxt=nextSecOf(LP.sec);
 app.innerHTML=lhead()+`<div class="result" style="--ac:${c.color}"><h2>${R('きょうの まとめ')}</h2>
 <div class="stack" style="width:100%;max-width:560px;text-align:left">${pts.map(b=>`<div class="point"><div class="pt">${R(b[1])}</div><div style="font-weight:700">${R(b[2])}</div></div>`).join('')}</div>
 <p><b>${R('じぶんで ふりかえろう。どのくらい わかった?')}</b></p>
 <div class="selfck">${[['ok','よく わかった','#2F8F6B'],['soso','すこし わかった','#F4B63A'],['not','まだ むずかしい','#E4684F']].map(([k,t,col])=>`<button data-k="${k}"><svg viewBox="0 0 40 40"><circle cx="20" cy="20" r="18" fill="${col}"/><path d="${k==='ok'?'M12 22 q8 8 16 0':k==='soso'?'M12 24 h16':'M12 26 q8 -8 16 0'}" stroke="#fff" stroke-width="3" fill="none" stroke-linecap="round"/><circle cx="14" cy="15" r="2.5" fill="#fff"/><circle cx="26" cy="15" r="2.5" fill="#fff"/></svg>${R(t)}</button>`).join('')}</div>
 ${nxt?`<p class="muted">${R('つぎの じゅぎょう: '+SEC[nxt].title)}</p>`:''}</div>`;
 bindBack(LP.exit);speak(P('きょうの まとめ。'+pts.map(b=>b[1]+'。'+b[2]).join('。')+'。じぶんで ふりかえろう。どのくらい わかった?'));
 $$('.selfck button').forEach(b=>b.onclick=()=>finishLesson(b.dataset.k));}
function nextSecOf(sec){const L=subjSecs(subjOf(sec)),i=L.indexOf(sec);return L[i+1]||null;}
function finishLesson(self){const sec=LP.sec,sc=SEC[sec];const first=!S.sec[sec];S.sec[sec]=true;
 S.und=S.und||{};S.und[sec]={self,tries:LP.gate.tries,hard:!!LP.hard,d:today()};
 S.srs=S.srs||{};S.srs[sec]={n:0,next:addDays(self==='ok'&&!LP.hard?2:1)};
 if(first)gain(60,40);save();syncSoon(800);SND.fan();
 const praise=self==='ok'?'すばらしい! じぶんの ことばで せつめい できるかな?':self==='soso'?'よく がんばったね。あした ふくしゅう すると もっと わかるよ。':'しょうじきに ふりかえれたのが えらい! あした もう{一度|いちど} いっしょに やろう。';
 app.innerHTML=`<div class="result"><div style="width:140px">${OWL()}</div><h2>${R('じゅぎょう おわり!')}</h2><p>${R(praise)}</p>${first?`<div class="gain"><span class="chip">${COIN} +40</span><span class="chip">+60 XP</span></div>`:''}${sc.card?fcard(sc.card,first):''}
 <div class="row center">${self==='not'?`<button class="btn" id="re">${R('せつめいを もう{一度|いちど}')}</button>`:''}<button class="btn go" id="ok">つぎへ</button></div></div>`;
 speak(P(praise));
 if($('#re'))$('#re').onclick=()=>{LP.ph=3;LP.gate={streak:0,tries:0,wrongRow:0};phase();};
 $('#ok').onclick=()=>{checkBoss(sec);const f=LP.onDone;LP=null;f();};}
function addDays(n){const d=new Date();d.setDate(d.getDate()+n);return d.getFullYear()+'-'+String(d.getMonth()+1).padStart(2,'0')+'-'+String(d.getDate()).padStart(2,'0');}
/* ふくしゅうの 間かく(1→3→7→14日) */
function srsDue(){S.srs=S.srs||{};const t=today();return Object.keys(S.srs).filter(s=>SEC[s]&&S.srs[s].next<=t);}
function srsMark(sec,ok){const r=S.srs&&S.srs[sec];if(!r)return;if(ok){if(r.next<=today()){r.n=Math.min(4,r.n+1);r.next=addDays([1,3,7,14,30][r.n]);}}else{r.n=0;r.next=addDays(1);}}
</script>

<style>
.kpad{position:relative;width:min(360px,86vw);aspect-ratio:1;max-width:100%;margin:0 auto;background:#fff;border-radius:18px;box-shadow:0 4px 0 var(--line);touch-action:none;user-select:none;-webkit-user-select:none}
.kpad svg{position:absolute;inset:0;width:100%;height:100%}
.kgrid{display:grid;grid-template-columns:repeat(auto-fill,minmax(64px,1fr));gap:8px}
.kcell{border:0;border-radius:14px;background:#fff;box-shadow:0 3px 0 var(--line);min-height:72px;display:flex;flex-direction:column;align-items:center;justify-content:center;font-size:30px;font-weight:700;line-height:1.1}

.kinfo span:nth-child(odd){color:var(--ink2);font-size:.8em}
.kstage{display:flex;gap:6px;justify-content:center;flex-wrap:wrap;margin-bottom:8px}
.kstage span{font-size:.75em;font-weight:900;padding:.15em .7em;border-radius:999px;background:#EEF2F3;color:var(--ink2)}
.kstage span.now{background:#C24A6A;color:#fff}.kstage span.done{background:var(--goodbg);color:var(--leaf)}
.kmodel{width:110px;height:110px;background:#fff;border-radius:12px;border:3px solid var(--line)}
@keyframes kshake{0%,100%{transform:translateX(0)}25%{transform:translateX(-6px)}75%{transform:translateX(6px)}}
.kpad.bad{animation:kshake .3s}
</style>
<script>
/* ===== 漢字れんしゅう(見る → なぞる → 見て書く → 見ないで書く) ===== */
const NS='http://www.w3.org/2000/svg';
const KST=['{見|み}る','なぞる','{見|み}て {書|か}く','{見|み}ないで {書|か}く'];
const kj=c=>(S.kj=S.kj||{},S.kj[c]||{st:0,stars:0});
function kanjiHome(backFn){backFn=backFn||home;const done=K3LIST.split('').filter(c=>kj(c).st>=4).length;
 app.innerHTML=`<div class="titlebar">${back()}<h2 style="color:#C24A6A">{漢字|かんじ} れんしゅう</h2><span class="chip">${done} / 200</span></div>
 <p class="muted">${R('3{年生|ねんせい}で ならう {漢字|かんじ} 200こ。{書|か}きじゅんを {見|み}て、なぞって、{見|み}ないで {書|か}けたら できあがり!')}</p>
 <div class="row" style="margin:10px 0"><button class="btn primary" id="nextk">${R('つぎの {漢字|かんじ}を ならう')}</button></div>
 ${[...Array(10)].map((_,g)=>`<div class="panel" style="margin-bottom:12px"><b>${g*20+1}〜${g*20+20}</b><div class="kgrid">${K3LIST.slice(g*20,g*20+20).split('').map(c=>{const k=kj(c);return `<button class="kcell ${k.st>=4?'done':''}" data-k="${c}">${c}<small>${'★'.repeat(k.stars||0)}${'☆'.repeat(3-(k.stars||0))}</small></button>`;}).join('')}</div></div>`).join('')}`;
 bindBack(backFn);
 $$('[data-k]').forEach(b=>b.onclick=()=>go(()=>kanjiLesson(b.dataset.k,()=>go(()=>kanjiHome(backFn)),()=>kanjiHome(backFn))));
 $('#nextk').onclick=()=>{const c=nextKanji();go(()=>kanjiLesson(c,()=>go(()=>kanjiHome(backFn)),()=>kanjiHome(backFn)));};}
function nextKanji(){return K3LIST.split('').find(c=>kj(c).st<4)||pick(K3LIST.split(''));}
function kanjiSlot(done,backFn){let n=0;const one=()=>{if(n>=2){done();return;}n++;go(()=>kanjiLesson(nextKanji(),one,backFn));};one();}
function kanjiLesson(c,onDone,exitFn){MODE='study';const info=K3[c];let stage=0,mistakes=0;
 const [on,kun,w,y]=info;
 const head=()=>`<div class="topbar">${back('やめる')}<b style="color:#C24A6A;font-size:1.4em">${c}</b><span class="chip">${stage+1}/4</span></div><div class="kstage">${KST.map((t,i)=>`<span class="${i<stage?'done':i===stage?'now':''}">${R(t)}</span>`).join('')}</div>`;
 const infoBox=()=>`<div class="kinfo"><span>${R('{音|おん}')}</span><span>${on||'—'}</span><span>くん</span><span>${kun||'—'}</span><span>れい</span><span><ruby>${w}<rt>${y}</rt></ruby></span></div>`;
 const readTxt=()=>`${c}。${on?'おんよみ、'+on.replace(/・/g,'、')+'。':''}${kun?'くんよみ、'+kun.replace(/[()]/g,'').replace(/・/g,'、')+'。':''}れい、${y}。`;
 const show=()=>{
  if(stage===0){app.innerHTML=head()+`<div class="kpad" id="pad"></div><div style="margin-top:10px">${infoBox()}</div><div class="lnav"><button class="btn ghost" id="re">${R('もう{一度|いちど} {見|み}る')}</button><button class="btn primary" id="nx">なぞって みる</button></div>`;
   bindBack(exitFn);const pad=Pad($('#pad'),c,{mode:'show'});pad.animate();speak(readTxt());$('#re').onclick=()=>{pad.animate();speak(readTxt());};$('#nx').onclick=()=>{stage=1;show();};return;}
  const prompt=stage===3?`<p class="prompt" style="text-align:center">${R(w===c?`「${y}」を {漢字|かんじ}で {書|か}こう`:`「${w.replace(c,'□')}」(${y})の □ を {書|か}こう`)}</p>`:stage===2?`<p class="prompt" style="text-align:center">${R('おてほんを {見|み}て {書|か}こう')}</p>`:`<p class="prompt" style="text-align:center">${R('うすい {字|じ}を なぞろう。{書|か}きじゅんも {大|だい}じ!')}</p>`;
  app.innerHTML=head()+prompt+`<div class="row center" style="align-items:flex-start;gap:14px">${stage===2?`<div class="kmodel">${kSVG(c,'#1F3A4A',4)}</div>`:''}<div class="kpad" id="pad"></div></div><div class="lnav"><button class="btn ghost" id="hint">ヒント</button><span id="msg" class="muted"></span><button class="btn ghost" id="clr">${R('{書|か}きなおす')}</button></div>`;
  bindBack(exitFn);if(stage===3)speak(w===c?`${y}を かんじで かこう`:`${y}の しかくに はいる かんじを かこう`);
  const pad=Pad($('#pad'),c,{mode:stage===1?'trace':'free',thr:[0,13,16,18][stage],onStroke:(ok,i,n)=>{if(!ok){mistakes++;$('#msg').innerHTML=R(pad.wrongs>=2?'こう {書|か}くよ。よく {見|み}てね':'おしい! もう{一度|いちど}');}else $('#msg').textContent=`${i+1} / ${n}`;},onDone:()=>{SND.good();
   setTimeout(()=>{if(stage<3){stage++;show();}else finish();},700);}});
  $('#hint').onclick=()=>pad.hint();$('#clr').onclick=()=>pad.reset();};
 const finish=()=>{const k=Object.assign({},kj(c));const stars=mistakes<=1?3:mistakes<=4?2:1;const first=(k.st||0)<4;k.st=4;k.stars=Math.max(k.stars||0,stars);S.kj[c]=k;if(first)gain(20,10);save();syncSoon();SND.fan();
  app.innerHTML=`<div class="result"><div style="font-size:96px;font-weight:700;line-height:1">${c}</div><h2>${R('{書|か}けた!')}</h2><div class="bigstars">${[0,1,2].map(i=>`<span class="pop" style="width:56px;display:inline-block">${STAR(i<stars)}</span>`).join('')}</div>${first?`<span class="chip">${COIN} +10</span>`:''}<div class="row center"><button class="btn" id="again">${R('もう{一度|いちど}')}</button><button class="btn go" id="ok">つぎへ</button></div></div>`;
  speak('かけた! すごいね。');$('#again').onclick=()=>kanjiLesson(c,onDone,exitFn);$('#ok').onclick=()=>onDone();};
 show();}
function kSVG(c,col,w){return `<svg viewBox="0 0 109 109" width="100%" height="100%">${KVG[c].map(d=>`<path d="${d}" fill="none" stroke="${col}" stroke-width="${w}" stroke-linecap="round" stroke-linejoin="round"/>`).join('')}</svg>`;}
/* 書く パッド */
function Pad(el,c,o){const strokes=KVG[c];let cur=0,pts=[],drawing=false;const api={wrongs:0};
 el.innerHTML=`<svg viewBox="0 0 109 109"><path d="M54.5 0 V109 M0 54.5 H109" stroke="#F3C6D4" stroke-width=".6" stroke-dasharray="2 2"/><rect x=".5" y=".5" width="108" height="108" fill="none" stroke="#F3C6D4"/>
  <g id="model">${o.mode==='show'?'':o.mode==='trace'?strokes.map(d=>`<path d="${d}" fill="none" stroke="#E3E8EA" stroke-width="7" stroke-linecap="round"/>`).join(''):''}</g><g id="ink"></g><g id="hintg"></g><path id="live" fill="none" stroke="#1F3A4A" stroke-width="5" stroke-linecap="round" stroke-linejoin="round"/><g id="nums"></g><g id="calc" style="visibility:hidden"></g></svg>`;
 const svg=el.querySelector('svg'),ink=svg.querySelector('#ink'),live=svg.querySelector('#live'),calc=svg.querySelector('#calc'),hintg=svg.querySelector('#hintg');
 const samp=d=>{const p=document.createElementNS(NS,'path');p.setAttribute('d',d);calc.appendChild(p);const L=p.getTotalLength();const r=[];for(let i=0;i<24;i++){const q=p.getPointAtLength(L*i/23);r.push([q.x,q.y]);}p.remove();return{pts:r,L};};
 const exp=strokes.map(samp);
 const dist=(a,b)=>Math.hypot(a[0]-b[0],a[1]-b[1]);
 const plen=p=>p.reduce((s,q,i)=>i?s+dist(q,p[i-1]):0,0);
 const resample=(p,n)=>{if(p.length<2)p=[p[0],[p[0][0]+.1,p[0][1]+.1]];const L=plen(p),step=L/(n-1);const out=[p[0]];let acc=0,i=1,prev=p[0];while(out.length<n&&i<p.length){const d=dist(prev,p[i]);if(acc+d>=step&&d>0){const t=(step-acc)/d;const q=[prev[0]+t*(p[i][0]-prev[0]),prev[1]+t*(p[i][1]-prev[1])];out.push(q);prev=q;acc=0;}else{acc+=d;prev=p[i];i++;}}while(out.length<n)out.push(p[p.length-1]);return out;};
 const judge=(user,e,thr)=>{const u=resample(user,24);let d=0;for(let i=0;i<24;i++)d+=dist(u[i],e.pts[i]);d/=24;const short=e.L<14;const t=thr+(short?5:0);
  const dirOK=dist(u[0],e.pts[0])+dist(u[23],e.pts[23])<=dist(u[0],e.pts[23])+dist(u[23],e.pts[0])+3;const ratio=plen(user)/e.L;
  return d<t&&(short||dirOK)&&ratio>(short?.15:.4)&&ratio<(short?4:2.4);};
 const toLocal=ev=>{const pt=svg.createSVGPoint();pt.x=ev.clientX;pt.y=ev.clientY;const m=svg.getScreenCTM().inverse();const q=pt.matrixTransform(m);return[q.x,q.y];};
 const addInk=(d,col='#1F3A4A')=>{const p=document.createElementNS(NS,'path');p.setAttribute('d',d);p.setAttribute('fill','none');p.setAttribute('stroke',col);p.setAttribute('stroke-width','5');p.setAttribute('stroke-linecap','round');p.setAttribute('stroke-linejoin','round');ink.appendChild(p);return p;};
 const animStroke=(d,col,delay=0,dur=600)=>{const p=document.createElementNS(NS,'path');p.setAttribute('d',d);p.setAttribute('fill','none');p.setAttribute('stroke',col);p.setAttribute('stroke-width','5');p.setAttribute('stroke-linecap','round');hintg.appendChild(p);const L=p.getTotalLength();p.style.strokeDasharray=L;p.style.strokeDashoffset=L;setTimeout(()=>{p.style.transition=`stroke-dashoffset ${dur}ms linear`;p.style.strokeDashoffset=0;},delay+20);return p;};
 api.animate=()=>{hintg.innerHTML='';svg.querySelector('#nums').innerHTML='';strokes.forEach((d,i)=>{animStroke(d,'#1F3A4A',i*750,600);const s=exp[i].pts[0];setTimeout(()=>{const t=document.createElementNS(NS,'text');t.setAttribute('x',s[0]-4);t.setAttribute('y',s[1]-2);t.setAttribute('font-size','7');t.setAttribute('fill','#E4684F');t.setAttribute('font-weight','700');t.textContent=i+1;svg.querySelector('#nums').appendChild(t);},i*750);});};
 api.hint=()=>{if(o.mode==='show')return;hintg.innerHTML='';const p=animStroke(strokes[cur],'#E4684F',0,700);setTimeout(()=>{p.style.transition='opacity .6s';p.style.opacity=0;},1500);};
 api.reset=()=>{ink.innerHTML='';hintg.innerHTML='';cur=0;api.wrongs=0;};
 if(o.mode==='show')return api;
 svg.addEventListener('pointerdown',ev=>{ev.preventDefault();if(cur>=strokes.length)return;drawing=true;pts=[toLocal(ev)];svg.setPointerCapture&&svg.setPointerCapture(ev.pointerId);live.setAttribute('d','');});
 svg.addEventListener('pointermove',ev=>{if(!drawing)return;ev.preventDefault();pts.push(toLocal(ev));live.setAttribute('d','M'+pts.map(p=>p[0].toFixed(1)+' '+p[1].toFixed(1)).join(' L'));});
 const end=ev=>{if(!drawing)return;drawing=false;live.setAttribute('d','');if(pts.length<1)return;
  const ok=judge(pts,exp[cur],o.thr||14);
  if(ok){addInk(strokes[cur]);api.wrongs=0;SND.tap();o.onStroke&&o.onStroke(true,cur,strokes.length);cur++;if(cur>=strokes.length)o.onDone&&o.onDone();}
  else{api.wrongs++;el.classList.remove('bad');void el.offsetWidth;el.classList.add('bad');SND.bad();o.onStroke&&o.onStroke(false,cur,strokes.length);if(api.wrongs>=2)api.hint();}};
 svg.addEventListener('pointerup',end);svg.addEventListener('pointercancel',end);svg.addEventListener('pointerleave',end);
 api.judge=judge;api.exp=exp;api.feed=(user)=>{pts=user;drawing=true;end();};
 return api;}
</script>

<script>
/* ===== おうちの人の設定(スマホ連携 / iPad内) ===== */
const SET=()=>S.remote||S.localSet||{};
const subjMode=s=>((SET().subj||{})[s])||'normal';
const focusSecs=()=>(SET().secs||[]).filter(x=>SEC[x]);
function accOf(sec){const d=S.drill[sec]||{ok:0,n:0};let ok=d.ok,n=d.n;Object.values(S.tests||{}).forEach(t=>{const v=(t.sec||{})[sec];if(v){ok+=v[0]*2;n+=v[1]*2;}});return n?ok/n:null;}
function weakSecs(){return allSecs().filter(s=>{const d=S.drill[s]||{n:0};const a=accOf(s);return a!==null&&a<.6&&(d.n>=3||Object.values(S.tests||{}).some(t=>(t.sec||{})[s]));}).sort((a,b)=>accOf(a)-accOf(b));}
function subjAcc(s){const ts=Object.keys(S.tests||{}).sort().slice(-7);let ok=0,n=0;ts.forEach(d=>{const v=(S.tests[d].by||{})[s];if(v){ok+=v[0];n+=v[1];}});
 if(!n)subjSecs(s).forEach(x=>{const d=S.drill[x];if(d){ok+=d.ok;n+=d.n;}});return n?ok/n:null;}
function subjLv(s){const a=subjAcc(s);if(a===null)return 0;return a>=.9?5:a>=.75?4:a>=.6?3:a>=.4?2:1;}

/* ===== 毎日テスト ===== */
function testDone(){return (S.tests||{})[today()];}
function testQs(){const N=SET().testN||15;const read=allSecs().filter(s=>S.sec[s]&&subjMode(subjOf(s))!=='off');
 let pool=read.length>=3?read:SUBJ.filter(x=>subjMode(x.id)!=='off').map(x=>subjSecs(x.id)[0]);
 const w=[];pool.forEach(s=>{let k=1;if(focusSecs().includes(s))k+=2;if(subjMode(subjOf(s))==='focus')k+=1;if(weakSecs().includes(s))k+=2;for(let i=0;i<k;i++)w.push(s);});
 focusSecs().forEach(s=>{if(!pool.includes(s))w.push(s,s);});
 (typeof srsDue==='function'?srsDue():[]).forEach(s=>w.push(s,s,s));
 const subs=[...new Set(w.map(subjOf))];const pickList=[];subs.forEach(su=>pickList.push(pick(w.filter(x=>subjOf(x)===su))));
 while(pickList.length<N)pickList.push(pick(w));
 let wordN=0;return shuffle(pickList.slice(0,N)).map((s,i)=>{let q=GEN[s](rand(1,4));if(q.type==='word'){if(wordN>=2)q=GEN.s13(3);else wordN++;}return Object.assign(q,{sec:q.type==='word'&&s==='s43'?'s43':s,step:1});});}
function startDailyTest(onDone,backFn){
 if(testDone()){go(()=>testResult(testDone(),onDone||home));return;}
 app.innerHTML=`<div class="titlebar">${back()}<h2>きょうの テスト</h2></div><div class="result"><div style="width:130px">${OWL()}</div><h2>${R('きょうの ちからだめし!')}</h2>
 <p>${R(`{全部|ぜんぶ}で ${SET().testN||15}{問|もん}。テストでは ヒントは つかえないよ。1{回|かい}で こたえよう。`)}</p><p class="muted">${R('けっかで「にがて」が わかると、つぎの {勉強|べんきょう}で しっかり れんしゅう できるよ。')}</p>
 <button class="btn primary" id="go">テスト スタート</button></div>`;
 bindBack(backFn||home);
 $('#go').onclick=()=>{app.classList.add('testmode');runSet({title:'きょうの テスト',qs:testQs(),color:'#B84A74',test:true,onDone:()=>{},back:()=>{app.classList.remove('testmode');(backFn||home)();},afterTest:onDone||home});};
}
function finishTest(){
 app.classList.remove('testmode');const by={},sec={};Q.qs.forEach((q,i)=>{if(Q.res[i]===undefined)return;const s=q.sec&&SEC[q.sec]?subjOf(q.sec):'math';by[s]=by[s]||[0,0];by[s][1]++;if(Q.res[i])by[s][0]++;if(SEC[q.sec]){sec[q.sec]=sec[q.sec]||[0,0];sec[q.sec][1]++;if(Q.res[i])sec[q.sec][0]++;}});
 const r={score:Q.score,total:Q.qs.length,by,sec};S.tests=S.tests||{};S.tests[today()]=r;const c=Q.score*5;gain(30,c);save();syncSoon(500);
 go(()=>testResult(r,Q.afterTest,c));}
function testResult(r,next,coins){
 const pct=Math.round(r.score/r.total*100);const weak=Object.keys(r.sec).filter(s=>r.sec[s][0]/r.sec[s][1]<.6).slice(0,5);
 const msg=pct>=90?'すばらしい! この ちょうし!':pct>=70?'よく できました!':pct>=50?'あと すこし! にがてを れんしゅう しよう':'だいじょうぶ。にがてが わかったのが {大|おお}きな {一歩|いっぽ}!';
 app.innerHTML=`<div class="titlebar">${back()}<h2>テストの けっか</h2></div><div class="result"><div style="width:120px">${OWL()}</div><h2>${R(msg)}</h2><p class="bigeq">${r.score} / ${r.total}</p>${coins?`<span class="chip">${COIN} +${coins}</span>`:''}
 <h3>${R('{教科|きょうか}ごとの レベル')}</h3><div class="stack" style="width:100%;align-items:center;gap:8px">${SUBJ.map(s=>{const v=r.by[s.id];const lv=subjLv(s.id);return `<div class="lvrow"><b style="color:${s.color}">${R(s.name)}</b><div class="lvbar"><i style="width:${lv*20}%;background:${s.color}"></i></div><span>${lv?'Lv.'+lv:'—'}${v?` <small class="muted">${v[0]}/${v[1]}</small>`:''}</span></div>`;}).join('')}</div>
 ${weak.length?`<h3>${R('つぎに がんばる ところ')}</h3><div class="stack" style="width:100%;max-width:460px;gap:8px">${weak.map(s=>`<div class="row between" style="background:#fff;border-radius:14px;padding:8px 12px"><span>${R(SEC[s].title)}</span><button class="btn small primary" data-rb="${s}">{教科書|きょうかしょ}を {読|よ}む</button></div>`).join('')}</div><p class="muted">${R('{時間|じかん}わりの「にがて こくふく」で れんしゅう できるよ。')}</p>`:''}
 <button class="btn go" id="ok">つぎへ</button></div>`;
 bindBack(home);$('#ok').onclick=()=>go(next||home);
 $$('[data-rb]').forEach(b=>b.onclick=()=>go(()=>bookSec(b.dataset.rb,0,()=>go(home),home)));}

/* ===== にがて こくふく ===== */
function focusQs(n=10){const out=[];const fs=focusSecs(),ws=weakSecs(),fsub=SUBJ.filter(s=>subjMode(s.id)==='focus').map(s=>s.id);
 const rel=m=>!fs.length&&!fsub.length||fs.includes(m.sec)||fsub.includes(SEC[m.sec]?subjOf(m.sec):'math');
 shuffle(S.miss.filter(rel)).slice(0,4).forEach(m=>out.push(Object.assign({},m,{step:1})));
 let pool=(typeof srsDue==='function'?srsDue():[]).concat(fs,ws.filter(s=>!fs.includes(s)));
 if(fsub.length)pool=pool.concat(fsub.flatMap(s=>subjSecs(s).filter(x=>S.sec[x])));
 if(!pool.length)pool=allSecs().filter(s=>S.sec[s]);if(!pool.length)pool=['s01','j11','e11'];
 return out.concat(makeQs(pool,Math.max(0,n-out.length)));}
function focusDesc(){const fs=focusSecs(),ws=weakSecs();if(fs.length)return R('おうちの{人|ひと}が えらんだ ところ + にがて');if(ws.length)return R(`にがて: ${SEC[ws[0]].title}`);return R('まちがえた {問題|もんだい}と ふくしゅう');}

/* ===== スマホへ おくる ===== */
function snapshot(){const d=today();const days=Object.keys(S.time).sort().slice(-30).map(k=>({d:k,sec:S.time[k],slots:k===d?todayDone().filter(Boolean).length:''}));
 if(!days.some(x=>x.d===d))days.push({d,sec:0,slots:todayDone().filter(Boolean).length});
 const tests=Object.keys(S.tests||{}).sort().slice(-30).map(k=>({d:k,score:S.tests[k].score,total:S.tests[k].total,by:S.tests[k].by}));
 return{v:1,name:P(S.name||''),lv:lvInfo(S.xp).l,coins:S.coins,
  today:{d,sec:S.time[d]||0,slots:todayDone().filter(Boolean).length,slotsTotal:TT().length,test:testDone()?{score:testDone().score,total:testDone().total}:null},
  days,tests,
  subj:SUBJ.map(s=>{const a=subjAcc(s.id);return{id:s.id,read:subjSecs(s.id).filter(x=>S.sec[x]).length,total:subjSecs(s.id).length,acc:a===null?null:Math.round(a*100),lv:subjLv(s.id)};}),
  secs:allSecs().map(s=>{const dd=S.drill[s]||{ok:0,n:0};let ok=dd.ok,n=dd.n;Object.values(S.tests||{}).forEach(t=>{const v=(t.sec||{})[s];if(v){ok+=v[0];n+=v[1];}});return{id:s,s:subjOf(s),t:P(SEC[s].title),read:!!S.sec[s],ok,n};}),
  und:S.und||{},kanji:Object.values(S.kj||{}).filter(k=>k.st>=4).length,
  miss:S.miss.slice(0,20).map(m=>({d:m.d,t:String(m.text||'').slice(0,60),a:String(m.ansText||''),u:String(m.u||'')}))};}
let syncT=null;
function syncSoon(ms=3000){clearTimeout(syncT);syncT=setTimeout(syncNow,ms);}
function syncNow(){const L=S.link;if(!L||!L.url)return Promise.resolve(false);
 return fetch(L.url,{method:'POST',headers:{'Content-Type':'text/plain;charset=utf-8'},body:JSON.stringify({key:L.key,snapshot:snapshot()})})
 .then(r=>r.json()).then(j=>{if(j.ok){L.last=Date.now();L.err='';if(j.settings){const old=JSON.stringify(S.remote||{});S.remote=j.settings;if(JSON.stringify(j.settings)!==old&&old!=='{}')toast('おうちの{人|ひと}の せっていが かわったよ');}save();return true;}L.err=j.err||'error';save();return false;})
 .catch(e=>{L.err=String(e.message||e);save();return false;});}
setInterval(()=>{if(document.visibilityState==='visible')syncNow();},5*60*1000);
document.addEventListener('visibilitychange',()=>{if(document.visibilityState==='visible')syncSoon(1500);});
/* 連携コード(URL|キー) */
function parseLink(code){code=String(code||'').trim();code=code.replace(/[\s\u200b]+/g,'').replace(/｜/g,'|');const m=code.match(/(https:\/\/script\.google\.com\/(?:a\/[^/]+\/)?macros\/s\/[A-Za-z0-9_-]+\/exec)[^|]*\|?([A-Za-z0-9]+)?/);if(!m)return null;
 let key=m[2];if(!key){const k=code.match(/[?&]key=([A-Za-z0-9]+)/);key=k&&k[1];}return key?{url:m[1],key}:null;}
(function(){try{const q=new URLSearchParams(location.search).get('link');if(q){const l=parseLink(decodeURIComponent(q));if(l){S.link=l;save();history.replaceState(null,'',location.pathname);setTimeout(()=>toast('スマホと つながりました'),800);}}}catch(e){}})();

/*ADULT*/
function linkPanel(){const L=S.link;const st=SET();
 return `<div class="panel"><b>スマホで学習状況を見る（保護者連携）</b>
 ${L&&L.url?`<p class="muted">連携中です。最終送信: ${L.last?new Date(L.last).toLocaleString('ja-JP'):'まだ'}${L.err?`<br><span style="color:var(--coral)">送信エラー: ${esc(L.err)}</span>`:''}</p><div class="row"><button class="btn small go" id="lsync">今すぐ送る</button><button class="btn small ghost" id="lcut">連携を解除</button></div>`:
 `<p class="muted">①保護者ページのURL（またはコード）を貼り付け、②キー（英数字10文字）を入力して「連携する」を押してください。保護者ページのURLを丸ごと貼り付けた場合、キーは自動で読み取ります。</p><textarea id="lcode" rows="3" style="width:100%;font:inherit;font-size:14px;border-radius:12px;border:2px solid var(--line);padding:8px" placeholder="https://script.google.com/macros/s/…/exec"></textarea><input id="lkey" placeholder="キー（例: 69f6aa3b51）" autocapitalize="off" autocorrect="off" spellcheck="false" style="width:100%;font:inherit;font-size:16px;border-radius:12px;border:2px solid var(--line);padding:8px;margin-top:6px"><div class="row"><button class="btn small go" id="lset">連携する</button><span id="lmsg" class="muted"></span></div>`}</div>
 <div class="panel"><b>重点にする教科・単元</b>${L&&L.url?'<p class="muted">連携中はスマホの保護者ページで設定します。現在の設定：'+SUBJ.map(s=>P(s.name)+'＝'+({focus:'重点',normal:'ふつう',off:'休み'}[subjMode(s.id)])).join('／')+'、重点単元 '+focusSecs().length+'件、テスト '+(st.testN||15)+'問</p>':
 `<p class="muted">重点：テストと「にがてこくふく」で優先して出題。休み：時間わりから外します。</p>${SUBJ.map(s=>`<div class="row between"><span>${P(s.name)}</span><div class="seg" data-fs="${s.id}">${[['focus','重点'],['normal','ふつう'],['off','休み']].map(([v,t])=>`<button data-v="${v}" class="${subjMode(s.id)===v?'on':''}">${t}</button>`).join('')}</div></div>`).join('')}
 <div class="row between"><span>毎日テストの問題数</span><div class="seg" id="ltn">${[10,15,20].map(n=>`<button data-v="${n}" class="${(st.testN||15)===n?'on':''}">${n}問</button>`).join('')}</div></div>
 <details><summary class="muted">重点単元を選ぶ（${focusSecs().length}件）</summary>${SUBJ.map(s=>`<div style="margin-top:6px"><b>${P(s.name)}</b>${subjSecs(s.id).map(x=>`<label style="display:flex;gap:8px;align-items:center;font-size:.85em"><input type="checkbox" data-fsec="${x}" ${focusSecs().includes(x)?'checked':''} style="width:20px;height:20px">${P(SEC[x].title)}</label>`).join('')}</div>`).join('')}</details>`}</div>`;}
function bindLink(){const L=S.link;
 if($('#lset'))$('#lset').onclick=()=>{const raw=($('#lcode').value||'').trim(),k=($('#lkey').value||'').trim();const l=parseLink(raw+(k&&!/[|?&]key=|\|/.test(raw)?'|'+k:''));if(!l){$('#lmsg').textContent=/script\.google\.com/.test(raw)?'キーを入力してください（保護者ページの下の連携コードの「|」より後ろの10文字）':'URLを読み取れませんでした。script.google.com から始まるURLを貼り付けてください';return;}S.link=l;save();$('#lmsg').textContent='送信テスト中…';syncNow().then(ok=>{$('#lmsg').textContent=ok?'連携しました':'送信できませんでした（URLとキーを確認してください）';setTimeout(parent,1200);});};
 if($('#lsync'))$('#lsync').onclick=()=>syncNow().then(()=>parent());
 if($('#lcut'))$('#lcut').onclick=()=>{S.link=null;S.remote=null;save();parent();};
 const ls=()=>{S.localSet=S.localSet||{};return S.localSet;};
 $$('[data-fs]').forEach(g=>g.querySelectorAll('button').forEach(b=>b.onclick=()=>{const o=ls();o.subj=o.subj||{};o.subj[g.dataset.fs]=b.dataset.v;save();parent();}));
 $$('#ltn button').forEach(b=>b.onclick=()=>{ls().testN=+b.dataset.v;save();parent();});
 $$('[data-fsec]').forEach(c=>c.onchange=()=>{const o=ls();o.secs=$$('[data-fsec]').filter(x=>x.checked).map(x=>x.dataset.fsec);save();});}
/*ENDADULT*/
</script>
<script>
/* ===== ショップ ===== */
function shop(){
 const slotName={hat:'ぼうし',face:'めがね',neck:'くび'};
 app.innerHTML=statusBar()+`<div class="titlebar">${back()}<h2>ショップ</h2><span class="muted">コインで ホーちゃんを きせかえ</span></div>
 <div class="hero" style="grid-template-columns:auto 1fr"><div class="partner">${OWL()}</div><div class="say">${R('どれが にあうかな? {買|か}った ものは タップで つけたり はずしたり できるよ。')}</div></div>
 <div class="shop">${ITEMS.map(it=>{const own=S.owned.includes(it.id),on=S.eq[it.slot]===it.id;
  return `<div class="item ${on?'on':''}">${OWL(Object.assign({hat:null,face:null,neck:null},{[it.slot]:it.id}))}<b>${R(it.name)}</b><span class="muted">${slotName[it.slot]}</span>
  ${own?`<button class="btn small ${on?'':'go'}" data-eq="${it.id}">${on?'はずす':'つける'}</button>`:`<button class="btn small primary" data-buy="${it.id}" ${S.coins<it.price?'disabled':''}><span class="pr">${it.price}</span> コイン</button>`}</div>`;}).join('')}</div>`;
 bindBack(home);
 $$('[data-buy]').forEach(b=>b.onclick=()=>{const it=ITEMS.find(x=>x.id===b.dataset.buy);if(S.coins<it.price)return;S.coins-=it.price;S.owned.push(it.id);S.eq[it.slot]=it.id;save();SND.coin();toast(`${it.name}を {買|か}ったよ!`);shop();});
 $$('[data-eq]').forEach(b=>b.onclick=()=>{const it=ITEMS.find(x=>x.id===b.dataset.eq);S.eq[it.slot]=S.eq[it.slot]===it.id?null:it.id;save();SND.tap();shop();});
}

 const tier=v=>v>=30?['#F4B63A','きん']:v>=20?['#A7B4BA','ぎん']:v>=10?['#C27A2C','どう']:null;

/*ADULT*/
const SLOTOPT=['test','math','jp','rot1','rot2','sci','soc','eng','scisoc','kanji','focus','word','game','review','rest'];
const minOpts=k=>SUBJK.includes(k)?[40,45,50,60]:[5,10,15,20,25,30,40];
function parent(){
 const days=Object.keys(S.time).sort().reverse().slice(0,14);
 const L=TT().map(x=>Object.assign({},x));const total=L.reduce((a,b)=>a+b.min,0);
 const subjRows=SUBJ.map(s=>{const secs=subjSecs(s.id);let ok=0,n=0;secs.forEach(x=>{const d=S.drill[x];if(d){ok+=d.ok;n+=d.n;}});return `<tr><td>${P(s.name)}</td><td>${secs.filter(x=>S.sec[x]).length} / ${secs.length}節</td><td>${ok} / ${n}${n?`（${Math.round(ok/n*100)}%）`:''}</td><td>${S.boss[s.id==='math'?'fin':s.id]?'撃破':'—'}</td></tr>`;}).join('');
 const secRows=allSecs().map(s=>{const d=S.drill[s]||{ok:0,n:0};return `<tr><td>${P(SUBJ.find(x=>x.id===subjOf(s)).name)}</td><td>${P(SEC[s].title)}</td><td>${S.sec[s]?'読了':'—'}</td><td>${d.ok} / ${d.n}</td></tr>`;}).join('');
 app.innerHTML=`<div class="titlebar">${back()}<h2>おうちの方へ</h2></div>
 <div class="stack">
  <div class="panel"><b>このアプリの使い方</b><p class="muted">小学3年の算数・国語・理科・社会・英語（外国語活動）を、「教科書（読む・さわる・クイズ）→問題」の順で学べます。<br>
  ・ホームの「きょうの時間わり」を上から進めます。教科のコマは1コマ40分（設定でも40分未満にはできません）で、間に10分の休けいが入ります。おすすめは「テスト10分→算数→休→国語→休→日がわりA→休→日がわりB」で、算数・国語は毎日、理科・社会・英語は3日で回る日がわり（毎日2教科）です。<br>
  ・教科のコマは「すごろく」形式で、算数は 授業→文章問題→ドリル→ラッシュ、国語は 授業→漢字2字→ドリル、理科・社会は 授業→ドリル→次の授業、英語は 授業→ラッシュ→ドリル と進みます。重点教科・重点単元を選んでいる場合は最後に「にがてこくふく」が加わります。最後まで進むと宝箱（コインと、きせかえの宝箱チケット）が出ます。<br>
  ・休けい中は画面から離れるよう案内し、次のコマで分かる「ひみつ」を予告します。休けい終了の合図から3分以内に戻るとボーナスがあります。コマをクリアした日は「がんばりカレンダー」にシールがつき、3日続くごとにチケットが増えます。<br>
  ・全節を読み終えた教科の授業ステップは、まぜまぜドリルになります。<br>
  ・理科・社会・英語は基礎知識がなくても進められるよう、キャラクターの会話、さわって確かめる図、「やってみよう（家でできる観察・体験）」、読み終えるともらえる「ふしぎカード」（豆知識）を入れています。英語はカードや問題の音声を聞いて進めます。<br>
  ・各単元は「はじまり（日常の場面となぜ学ぶか）→前の学習の確認→めあて→アニメと音声の説明→やってみよう→たしかめ（3問連続正解で合格、間違えると別の説明）→練習→まとめと自己評価」の流れで進みます。学んだ単元は1・3・7・14日後にテストや「にがてこくふく」で再出題します。<br>  ・漢字は3年生の200字を「書き順を見る→なぞる→見て書く→見ないで書く」で練習し、線の形と書き順を自動で判定します（筆順データ：KanjiVG, CC BY-SA 3.0）。<br>  ・間違えた問題は自動で「ふくしゅう」に入り、正解すると消えます。勉強時間は教科書・問題・ゲームの画面を開いている間だけ数えます。記録はこのiPadのブラウザ内にだけ保存されます。</p></div>
  ${linkPanel()}
  <div class="panel"><b>時間わりの設定</b><p class="muted">コマの教科と時間を変えられます。合計 <b id="tttot">${total}</b> 分（教科のコマは40分以上）</p>
   <div class="stack" style="gap:8px" id="ttlist">${L.map((x,i)=>`<div class="ttrow"><span>${i+1}</span><select data-k="${i}">${SLOTOPT.map(k=>`<option value="${k}" ${x.k===k?'selected':''}>${P(SLOT[k].name)}</option>`).join('')}</select><select data-m="${i}">${minOpts(x.k).map(m=>`<option ${x.min===m?'selected':''}>${m}</option>`).join('')}</select><button class="btn small ghost" data-del="${i}">削除</button></div>`).join('')}</div>
   <div class="row"><button class="btn small" id="ttadd">コマを追加</button><button class="btn small go" id="ttsave">保存する</button><button class="btn small ghost" id="ttdef">おすすめに戻す</button><span id="ttmsg" class="muted"></span></div></div>
  <div class="panel"><b>設定</b>
   <div><div class="muted">ふりがな</div><div class="seg" id="furi">${[['all','すべての漢字'],['2','2・3年の漢字（おすすめ）'],['3','3年の漢字だけ'],['none','なし']].map(([v,t])=>`<button data-v="${v}" class="${S.furi===v?'on':''}">${t}</button>`).join('')}</div></div>
   <div><div class="muted">効果音</div><div class="seg" id="snd"><button data-v="1" class="${S.sound?'on':''}">オン</button><button data-v="0" class="${S.sound?'':'on'}">オフ</button></div></div>
   <div class="row"><span class="muted">名前: ${S.name}</span><button class="btn small" id="rename">名前を変える</button></div></div>
  <div class="panel"><b>勉強時間</b>${days.length?`<div class="tbl"><table><thead><tr><th>日付</th><th>勉強時間</th><th>目標比</th></tr></thead><tbody>${days.map(d=>`<tr><td>${d}</td><td>${P(jpT(S.time[d]))}</td><td>${Math.round(S.time[d]/(total*60)*100)}%</td></tr>`).join('')}</tbody></table></div>`:'<p class="muted">まだ記録がありません。</p>'}</div>
  <div class="panel"><b>教科ごとの進み具合</b><div class="tbl"><table><thead><tr><th>教科</th><th>教科書</th><th>正解 / 解いた数</th><th>ボス</th></tr></thead><tbody>${subjRows}</tbody></table></div>
   <details><summary class="muted">節ごとの記録を見る</summary><div class="tbl"><table><thead><tr><th>教科</th><th>節</th><th>教科書</th><th>正解/解いた数</th></tr></thead><tbody>${secRows}</tbody></table></div></details>
   <p class="muted">レベル ${lvInfo(S.xp).l} ・ コイン ${S.coins}</p></div>
  <div class="panel"><b>まちがえた問題（新しい順）</b>${S.miss.length?`<div class="tbl"><table><thead><tr><th>日付</th><th>問題</th><th>正しい答え</th><th>入力</th></tr></thead><tbody>${S.miss.slice(0,40).map(m=>`<tr><td>${m.d||''}</td><td style="white-space:normal;min-width:220px">${esc(m.text)}</td><td>${esc(m.ansText)}</td><td>${esc(m.u||'')}</td></tr>`).join('')}</tbody></table></div>`:'<p class="muted">ありません。</p>'}</div>
  <div class="panel"><b>記録のリセット</b><p class="muted">名前と時間わりの設定以外の記録（コイン・レベル・進み具合）を消します。</p><div class="row"><button class="btn red" id="rst">リセットする</button><span id="rstc"></span></div></div>
 </div>`;
 bindBack(home);bindLink();
 const tot=()=>{$('#tttot').textContent=L.reduce((a,b)=>a+b.min,0);};
 $$('[data-k]').forEach(s=>s.onchange=()=>{const x=L[+s.dataset.k];x.k=s.value;const o=minOpts(x.k);if(!o.includes(x.min))x.min=SUBJK.includes(x.k)?40:10;S.tt=L;save();parent();});
 $$('[data-m]').forEach(s=>s.onchange=()=>{L[+s.dataset.m].min=+s.value;tot();});
 $$('[data-del]').forEach(b=>b.onclick=()=>{if(L.length<=1)return;L.splice(+b.dataset.del,1);S.tt=L;save();parent();});
 $('#ttadd').onclick=()=>{L.push({k:'math',min:40});S.tt=L;save();parent();};
 $('#ttsave').onclick=()=>{S.tt=L;S.today=null;save();$('#ttmsg').textContent='保存しました';};
 $('#ttdef').onclick=()=>{S.tt=null;S.today=null;save();parent();};
 $$('#furi button').forEach(b=>b.onclick=()=>{S.furi=b.dataset.v;document.body.dataset.furi=S.furi;save();parent();});
 $$('#snd button').forEach(b=>b.onclick=()=>{S.sound=b.dataset.v==='1';save();parent();});
 $('#rename').onclick=()=>nameScreen(parent);
 $('#rst').onclick=()=>{$('#rstc').innerHTML='<button class="btn small red" id="y">本当に消す</button> <button class="btn small ghost" id="n">やめる</button>';
  $('#y').onclick=()=>{const n=S.name,f=S.furi,t=S.tt;S=blank();S.name=n;S.furi=f;S.tt=t;S.ttv=TTV;save();parent();};$('#n').onclick=()=>{$('#rstc').innerHTML='';};};
}

/* ふりがな記法が そのまま 出ないように 自動で 変かん */
function fixRuby(root){const w=document.createTreeWalker(root,NodeFilter.SHOW_TEXT),list=[];let n;
 while((n=w.nextNode()))if(/\{[^|{}]+\|[^{}]+\}/.test(n.nodeValue)&&!n.parentNode.closest('script,style,svg'))list.push(n);
 list.forEach(t=>{const sp=document.createElement('span');sp.innerHTML=R(esc(t.nodeValue).replace(/&amp;/g,'&'));t.replaceWith(...sp.childNodes);});}
new MutationObserver(()=>fixRuby(app)).observe(app,{childList:true,subtree:true});

/* 起動 */
if(!S.name)nameScreen(home);else home();
syncSoon(2500);
</script>
