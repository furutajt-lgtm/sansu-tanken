<style>
*,*::before,*::after{box-sizing:border-box}
:root{padding-top:env(safe-area-inset-top,0px);padding-bottom:env(safe-area-inset-bottom,0px)}
body{margin:0;-webkit-text-size-adjust:100%}
img{max-width:100%}
[hidden]{display:none!important}
</style>
<title>まなびたんけん</title>
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link rel="stylesheet" href="https://fonts.googleapis.com/css2?family=Mochiy+Pop+One&family=Zen+Maru+Gothic:wght@500;700;900&display=swap">
<style>
:root{
  --sky:#D7EEF3; --paper:#FFFBF1; --page:#FFFDF7; --ink:#1F3A4A; --ink2:#4F6B78; --line:#BCD7DE;
  --leaf:#2F8F6B; --sun:#F4B63A; --coral:#E4684F; --sea:#3E6FB5; --clay:#C27A2C; --grape:#7A5BB5;
  --goodbg:#E3F4EA; --trybg:#FFF3D6; --missbg:#FCE6E1;
  color-scheme: light;
}
html,body{background:var(--sky)}
body{color:var(--ink);font-family:"Zen Maru Gothic","Hiragino Maru Gothic ProN","Hiragino Sans",sans-serif;font-size:20px;font-weight:500;line-height:1.7}
.wrap{max-width:920px;margin:0 auto;padding-inline:16px;padding-block:12px 64px}
h1,h2,h3,.disp{font-family:"Mochiy Pop One","Zen Maru Gothic",sans-serif;font-weight:400;text-wrap:balance;margin:0;line-height:1.5}
p{margin:0}
ruby rt{font-size:.52em;font-weight:700;color:var(--ink2);letter-spacing:0}
body[data-furi="2"] ruby.g1 rt,
body[data-furi="3"] ruby.g1 rt, body[data-furi="3"] ruby.g2 rt,
body[data-furi="none"] ruby rt{display:none}
button{font:inherit;color:inherit;touch-action:manipulation;-webkit-tap-highlight-color:transparent;cursor:pointer}
button:focus-visible{outline:4px solid var(--sea);outline-offset:3px}
input{font:inherit}
.btn{border:0;border-radius:18px;padding:.5em 1.1em;background:var(--paper);box-shadow:0 4px 0 var(--line);font-weight:700;min-height:56px}
.btn:active{transform:translateY(3px);box-shadow:0 1px 0 var(--line)}
.btn.primary{background:var(--sun);box-shadow:0 4px 0 #C98F1F}
.btn.go{background:var(--leaf);color:#fff;box-shadow:0 4px 0 #1E6A4E}
.btn.red{background:var(--coral);color:#fff;box-shadow:0 4px 0 #B24A35}
.btn.ghost{background:transparent;box-shadow:none;border:3px solid var(--line)}
.btn.small{min-height:44px;padding:.25em .9em;font-size:.85em}
.btn[disabled]{opacity:.4;pointer-events:none}
.row{display:flex;flex-wrap:wrap;align-items:center;gap:12px}
.between{justify-content:space-between}
.center{justify-content:center}
.stack{display:flex;flex-direction:column;gap:16px}
.muted{color:var(--ink2);font-size:.85em}
.chip{display:inline-flex;align-items:center;gap:6px;background:var(--paper);border-radius:999px;padding:.15em .8em;font-weight:900;font-variant-numeric:tabular-nums;white-space:nowrap}
.chip svg{width:24px;height:24px}
.titlebar{display:flex;align-items:center;gap:12px;margin-bottom:16px;flex-wrap:wrap}
.titlebar h2{font-size:clamp(22px,4vw,30px)}

/* status bar */
.status{display:flex;align-items:center;gap:10px;flex-wrap:wrap;justify-content:space-between;margin-bottom:10px}
.lvl{display:flex;align-items:center;gap:10px;background:var(--paper);border-radius:18px;padding:6px 12px;min-width:240px;flex:1}
.lvl .badge{font-family:"Mochiy Pop One",sans-serif;background:var(--grape);color:#fff;border-radius:12px;padding:0 .5em;white-space:nowrap}
.xpbar{flex:1;height:14px;background:#E7ECEE;border-radius:99px;overflow:hidden;min-width:80px}
.xpbar i{display:block;height:100%;background:linear-gradient(90deg,var(--grape),#A98BE0);border-radius:99px;transition:width .6s}

/* home */
.hero{display:grid;grid-template-columns:auto 1fr;gap:16px;align-items:center;background:var(--paper);border-radius:28px;padding:16px 18px;margin-bottom:16px}
.partner{width:130px;height:146px}
.hero .title{font-size:clamp(26px,5vw,38px)}

@media (prefers-reduced-motion:reduce){.scale .needle{transition:none}}

.wbox{background:#fff;border-radius:18px;padding:16px 8px;text-align:center;font-family:"Mochiy Pop One",sans-serif;font-size:clamp(20px,4.4vw,30px);border:4px solid var(--line)}
.tape{width:100%;max-width:560px;height:auto;display:block;margin:0 auto}
.problem{font-size:1.15em;line-height:2.2;background:#fff;border-radius:18px;padding:12px 16px;border:3px solid var(--line)}

/* boss */
.arena{background:linear-gradient(#2C2447,#46386E);border-radius:26px;padding:14px 16px;color:#fff;display:grid;grid-template-columns:1fr auto;gap:12px;align-items:center;margin-bottom:12px}

/* toast */
#toast{position:fixed;left:50%;bottom:calc(20px + env(safe-area-inset-bottom,0px));transform:translateX(-50%);background:var(--ink);color:#fff;border-radius:18px;padding:.6em 1.1em;font-weight:900;z-index:50;max-width:90vw;text-align:center;box-shadow:0 8px 24px rgba(0,0,0,.2)}

/* parent */
.panel{background:var(--paper);border-radius:22px;padding:18px;display:flex;flex-direction:column;gap:12px}

.namebox{font-size:28px;padding:.4em .6em;border-radius:16px;border:4px solid var(--line);width:100%;max-width:340px;text-align:center}
</style>

<script>
'use strict';
const app=document.getElementById('app');

/* ===== 漢字の学年(1〜3年) ===== */
const G1='一右雨円王音下火花貝学気九休玉金空月犬見五口校左三山子四糸字耳七車手十出女小上森人水正生青夕石赤千川先早草足村大男竹中虫町天田土二日入年白八百文木本名目立力林六';

const G3='悪安暗医委意育員院飲運泳駅央横屋温化荷界開階寒感漢館岸起期客究急級宮球去橋業曲局銀区苦具君係軽血決研県庫湖向幸港号根祭皿仕死使始指歯詩次事持式実写者主守取酒受州拾終習集住重宿所暑助昭消商章勝乗植申身神真深進世整昔全相送想息速族他打対待代第題炭短談着注柱丁帳調追定庭笛鉄転都度投豆島湯登等動童農波配倍箱畑発反坂板皮悲美鼻筆氷表秒病品負部服福物平返勉放味命面問役薬由油有遊予羊洋葉陽様落流旅両緑礼列練路和';
const gradeOf=k=>Math.max(...[...k].map(c=>G1.includes(c)?1:G2.includes(c)?2:G3.includes(c)?3:4));

function R(s){return String(s).replace(/@name/g,NAME()).replace(/\{([^|{}]+)\|([^{}]+)\}/g,(m,k,y)=>`<ruby class="g${gradeOf(k)}">${k}<rt>${y}</rt></ruby>`);}
function H(s){return R(s).replace(/\[\[(.+?)\]\]/g,'<mark class="key">$1</mark>').replace(/\(\((.+?)\)\)/g,'<mark class="ask">$1</mark>').replace(/##(\d+)##/g,'<b class="num">$1</b>');}
function P(s){return String(s).replace(/@name/g,NAME()).replace(/<svg[\s\S]*?<\/svg>/g,'').replace(/\{([^|{}]+)\|([^{}]+)\}/g,'$2').replace(/<rt>.*?<\/rt>/g,'').replace(/<[^>]+>/g,' ').replace(/\[\[|\]\]|\(\(|\)\)|##/g,'').replace(/%\d/g,'なに').replace(/\s+/g,' ').trim();}
function SPK(s){return P(s).replace(/(\d+)\s*kg/g,'$1キログラム').replace(/(\d+)\s*g/g,'$1グラム').replace(/(\d+)\s*t(?![a-z])/g,'$1トン').replace(/(\d+)\s*cm/g,'$1センチメートル').replace(/÷/g,' わる ').replace(/×/g,' かける ').replace(/−/g,' ひく ').replace(/\+/g,' たす ').replace(/=/g,' は ').replace(/□/g,' なに ');}
function say(t){try{if(!('speechSynthesis' in window))return;speechSynthesis.cancel();const u=new SpeechSynthesisUtterance(SPK(t));u.lang='ja-JP';u.rate=.85;speechSynthesis.speak(u);}catch(e){}}

function scaleSVG(v,max=1000){
  const cx=130,cy=130,r=112,step=max/100;let s=`<svg viewBox="0 0 260 260" class="scale" role="img" aria-label="はかり">`;
  s+=`<circle cx="${cx}" cy="${cy}" r="126" fill="#DDE6EA" stroke="#1F3A4A" stroke-width="4"/><circle cx="${cx}" cy="${cy}" r="${r+5}" fill="#fff"/>`;
  for(let i=0;i<100;i++){const a=(i*3.6-90)*Math.PI/180,L=i%10==0?18:i%5==0?12:7;
    const x1=cx+r*Math.cos(a),y1=cy+r*Math.sin(a),x2=cx+(r-L)*Math.cos(a),y2=cy+(r-L)*Math.sin(a);
    s+=`<line x1="${x1.toFixed(1)}" y1="${y1.toFixed(1)}" x2="${x2.toFixed(1)}" y2="${y2.toFixed(1)}" stroke="#1F3A4A" stroke-width="${i%10==0?3:i%5==0?2:1.2}"/>`;
    if(i%10==0){const tx=cx+(r-34)*Math.cos(a),ty=cy+(r-34)*Math.sin(a);s+=`<text x="${tx.toFixed(1)}" y="${(ty+6).toFixed(1)}" text-anchor="middle" font-size="${max>1000?15:17}" font-weight="700" fill="#1F3A4A" font-family="sans-serif">${i*step}</text>`;}
  }
  s+=`<text x="${cx}" y="${cy+50}" text-anchor="middle" font-size="14" fill="#4F6B78" font-family="sans-serif">${max/1000}kg はかり (g)</text>`;
  s+=`<g class="needle" style="transform-origin:${cx}px ${cy}px;transform:rotate(${v/max*360}deg)"><line x1="${cx}" y1="${cy+16}" x2="${cx}" y2="${cy-r+4}" stroke="#E4684F" stroke-width="4" stroke-linecap="round"/></g><circle cx="${cx}" cy="${cy}" r="8" fill="#E4684F"/></svg>`;
  return s;
}
/* テープ図 o={total,parts,part,unit,ask:'total'|'part'} または o={a,b,op:'+'|'-',unit,ask} */
function tapeSVG(o){
  const W=520,x0=20,y=50,h=44;let s=`<svg viewBox="0 0 560 150" class="tape" role="img" aria-label="テープ図">`;
  const lab=(x,yy,t,c='#1F3A4A')=>`<text x="${x}" y="${yy}" text-anchor="middle" font-size="20" font-weight="700" fill="${c}" font-family="sans-serif">${t}</text>`;
  const brace=(xa,xb,yy,up)=>`<path d="M${xa} ${yy} v${up?-10:10} H${xb} v${up?10:-10}" stroke="#4F6B78" stroke-width="2.5" fill="none"/>`;
  if(o.parts){const w=W/o.parts;
    for(let i=0;i<o.parts;i++)s+=`<rect x="${x0+i*w}" y="${y}" width="${w}" height="${h}" fill="${i===0?'#FFE08A':'#DCEBFF'}" stroke="#1F3A4A" stroke-width="2"/>`;
    s+=brace(x0,x0+W,y-4,true)+lab(x0+W/2,y-22,o.ask==='total'?'□'+o.unit:o.total+o.unit,o.ask==='total'?'#E4684F':'#1F3A4A');
    s+=brace(x0,x0+w,y+h+4,false)+lab(x0+w/2,y+h+36,o.ask==='part'?'□'+o.unit:o.part+o.unit,o.ask==='part'?'#E4684F':'#1F3A4A');
    s+=lab(x0+W-60,y+h+36,o.parts+'つぶん','#4F6B78');
  }else{const tot=o.a+o.b,wa=W*o.a/tot;
    s+=`<rect x="${x0}" y="${y}" width="${wa}" height="${h}" fill="#DCEBFF" stroke="#1F3A4A" stroke-width="2"/><rect x="${x0+wa}" y="${y}" width="${W-wa}" height="${h}" fill="#FFE08A" stroke="#1F3A4A" stroke-width="2"/>`;
    const T=o.ask==='total'?'□':tot,A=o.ask==='a'?'□':o.a,B=o.ask==='b'?'□':o.b,col=k=>o.ask===k?'#E4684F':'#1F3A4A';
    s+=brace(x0,x0+W,y-4,true)+lab(x0+W/2,y-22,T+o.unit,col('total'));
    s+=lab(x0+wa/2,y+h/2+7,A+o.unit,col('a'))+lab(x0+wa+(W-wa)/2,y+h/2+7,B+o.unit,col('b'));
  }
  return s+'</svg>';
}
function toast(html,ms=2200){const t=$('#toast');t.innerHTML=R(html);t.hidden=false;clearTimeout(toast.t);toast.t=setTimeout(()=>t.hidden=true,ms);}

<script>
/* ===== レベル・コイン ===== */
const TITLES=['{見習|みなら}い たんけん{家|か}','かけ{出|だ}し たんけん{家|か}','まなび たんけん{家|か}','なぞとき{名人|めいじん}','{数|かず}の はかせ','まなびマスター','でんせつの たんけん{家|か}'];
function lvInfo(xp){let l=1,need=100,rest=xp;while(rest>=need){rest-=need;l++;need=100+50*(l-1);}return{l,rest,need,title:TITLES[Math.min(TITLES.length-1,Math.floor((l-1)/3))]};}
function gain(xp,coins){const before=lvInfo(S.xp).l;S.xp+=xp;S.coins+=coins;save();const after=lvInfo(S.xp).l;if(after>before){SND.lvl();levelUp(after);}clearTimeout(gain.t);gain.t=setTimeout(()=>{if(typeof checkAch==='function')checkAch();},800);}
function levelUp(l){$$('.overlay').forEach(x=>x.remove());const o=document.createElement('div');o.className='overlay';o.innerHTML=`<div class="card pop"><div style="width:140px">${OWL()}</div><h2>レベル アップ!</h2><p class="bigeq">Lv.${l}</p><p>${R(lvInfo(S.xp).title)}</p><button class="btn primary">やったね</button></div>`;document.body.appendChild(o);o.querySelector('button').onclick=()=>o.remove();}

/* ===== 勉強時間 ===== */
let MODE='menu',tick=0;
setInterval(()=>{if(MODE==='study'&&document.visibilityState==='visible'){const d=today();S.time[d]=(S.time[d]||0)+1;if(++tick%15===0)save();const c=$('#clk');if(c)c.textContent=fmtT(S.time[d]);}},1000);
const fmtT=s=>`${Math.floor(s/3600)}:${String(Math.floor(s%3600/60)).padStart(2,'0')}`;
const jpT=s=>{const h=Math.floor(s/3600),m=Math.floor(s%3600/60);return (h?h+'{時間|じかん}':'')+m+'{分|ふん}';};

/* ===== 共通パーツ ===== */
function statusBar(){const v=lvInfo(S.xp);return `<div class="status"><div class="lvl"><span class="badge">Lv.${v.l}</span><div style="flex:1"><div style="font-size:.75em;font-weight:900">${R(v.title)}</div><div class="xpbar"><i style="width:${v.rest/v.need*100}%"></i></div></div></div><span class="chip">${COIN} ${S.coins}</span></div>`;}
function go(fn){MODE='menu';try{speechSynthesis.cancel();}catch(e){}fn();window.scrollTo(0,0);}
const back=(label='もどる')=>`<button class="btn ghost" data-back>← ${R(label)}</button>`;
function bindBack(fn){$$('[data-back]').forEach(b=>b.onclick=()=>go(fn));}
const esc=s=>String(s).replace(/[&<>"]/g,c=>({'&':'&amp;','<':'&lt;','>':'&gt;','"':'&quot;'}[c]));

/* ===== なまえ ===== */
function nameScreen(after){
 app.innerHTML=`<div class="result" style="margin-top:20px"><div style="width:150px">${OWL()}</div><h2>はじめまして! ぼくは ホーちゃん</h2><p>きみの なまえを おしえてね。</p><input id="nm" class="namebox" maxlength="10" autocomplete="off" value="${esc(S.name)}" aria-label="なまえ"><button class="btn primary" id="ok">けってい</button></div>`;
 $('#ok').onclick=()=>{const v=$('#nm').value.trim();if(!v){$('#nm').focus();return;}S.name=esc(v);save();SND.fan();(after||home)();};
}

const chIdx=id=>CH.findIndex(c=>c.id===id);
const secsOf=chs=>chs.flatMap(c=>CH[chIdx(c)].secs);
/* ===== 時間わり(教科を まぜた 1日3時間) ===== */
const SLOT={
 math:{name:'{算数|さんすう}',color:'#2F8F6B'},jp:{name:'{国語|こくご}',color:'#C24A6A'},sci:{name:'{理科|りか}',color:'#3E9A5A'},soc:{name:'{社会|しゃかい}',color:'#C27A2C'},eng:{name:'えいご',color:'#3E6FB5'},
 scisoc:{name:'{理科|りか}・{社会|しゃかい}({日|ひ}がわり)',color:'#6A8A3A'},word:{name:'{文章|ぶんしょう}{問題|もんだい}',color:'#7A5BB5'},game:{name:'ゲーム',color:'#E4684F'},
 review:{name:'ふくしゅう',color:'#C27A2C'},test:{name:'きょうの テスト',color:'#B84A74'},focus:{name:'にがて こくふく',color:'#D9A421'},rest:{name:'{休|やす}けい',color:'#8AA8B4'}
};
const DEFAULT_TT=[{k:'test',min:15},{k:'math',min:25},{k:'jp',min:25},{k:'rest',min:10},{k:'scisoc',min:25},{k:'eng',min:20},{k:'rest',min:10},{k:'focus',min:25},{k:'word',min:15},{k:'game',min:10}];
const TT=()=>(S.tt&&S.tt.length?S.tt:DEFAULT_TT);
const dayNo=()=>Math.floor(Date.now()/864e5);
const allSecs=()=>CH.flatMap(c=>c.secs);
const nextSec=subj=>subjSecs(subj).find(s=>!S.sec[s]);
const subjOf=sec=>CH.find(c=>c.secs.includes(sec)).subj;
function slotSubj(k){if(k==='scisoc'){const a=dayNo()%2?'sci':'soc',b=a==='sci'?'soc':'sci';k=subjMode(a)!=='off'?a:subjMode(b)!=='off'?b:'focus';}
 if(['math','jp','sci','soc','eng'].includes(k)&&subjMode(k)==='off')return 'focus';return k;}
function slotDesc(b){const k=slotSubj(b.k);
 if(['math','jp','sci','soc','eng'].includes(k)){const n=nextSec(k);return n?`${R(SEC[n].title)}(よむ → {問題|もんだい})`:'まぜまぜ ドリル';}
 if(k==='word')return '4つの ステップで 5{問|もん}';
 if(k==='game')return R(RUSH[gameOf()].name);
 if(k==='review')return `まちがえた {問題|もんだい} ${S.miss.length}{問|もん}`;
 if(k==='test'){const t=testDone();return t?R(`${t.score}/${t.total} せいかい`):R(`${SET().testN||15}{問|もん}の ちからだめし`);}
 if(k==='focus')return focusDesc();
 if(k==='rest')return '{目|め}と からだを {休|やす}めよう';return '';}
function gameOf(){const ks=Object.keys(RUSH);return ks[dayNo()%ks.length];}
function todayDone(){const d=today();if(!S.today||S.today.d!==d)S.today={d,done:[]};return S.today.done;}
function ttScreen(){
 const L=TT(),dn=todayDone(),t=S.time[today()]||0,nextI=L.findIndex((_,i)=>!dn[i]),total=L.reduce((a,b)=>a+b.min,0);
 app.innerHTML=`<div class="titlebar">${back()}<h2>きょうの {時間|じかん}わり</h2></div>
 <div class="clock"><div><div class="muted">きょうの {勉強|べんきょう}{時間|じかん}</div><div class="big"><span id="clk">${fmtT(t)}</span> / ${fmtT(total*60)}</div></div><div style="width:84px">${OWL()}</div></div>
 <div class="sched">${L.map((b,i)=>{const k=slotSubj(b.k),done=dn[i];
  return `<button class="blk ${k==='rest'?'isrest':''} ${done?'done':''} ${i===nextI?'next':''}" data-i="${i}" style="border-left:8px solid ${SLOT[k].color}"><span class="tm"><b>${b.min}</b>{分|ふん}</span><span><span class="nm">${i+1}. ${R(SLOT[k].name)}</span><span class="ds">${slotDesc(b)}</span></span><span class="ck">${done?'✓':''}</span></button>`;}).join('')}</div>
 <p class="muted" style="margin-top:10px">{上|うえ}から じゅんばんに すすめよう。{休|やす}けいも ちゃんと とってね。</p>`;
 bindBack(home);
 $$('.blk').forEach(b=>b.onclick=()=>{SND.tap();const i=+b.dataset.i;runSlot(i,L[i]);});
}
function finishSlot(i){const dn=todayDone();const first=!dn[i];dn[i]=true;save();
 if(first){gain(30,20);if(TT().every((_,j)=>dn[j])){S.fullDays=(S.fullDays||0)+1;gain(100,100);setTimeout(()=>toast('きょうの {時間|じかん}わり ぜんぶ クリア! +100コイン',3000),400);}}
 syncSoon();go(ttScreen);}
function studySubj(subj,done,backFn){const n=nextSec(subj),c=SUBJ.find(x=>x.id===subj);
 if(n)go(()=>bookSec(n,0,()=>go(()=>runSet({title:P(SEC[n].title),qs:makeQs([n],6),color:c.color,onDone:()=>{checkBoss(n);done();},back:backFn})),backFn));
 else go(()=>runSet({title:'まぜまぜ ドリル',qs:makeQs(subjSecs(subj),8),color:c.color,onDone:done,back:backFn}));}
function checkBoss(sec){const ch=CH.find(c=>c.secs.includes(sec));if(ch.subj==='math'){if(ch.secs.every(s=>S.sec[s]))setTimeout(()=>toast(`ボス「${BOSSES[ch.id].name}」が あらわれた!`,3000),300);}
 else if(subjSecs(ch.subj).every(s=>S.sec[s]))setTimeout(()=>toast(`ボス「${BOSSES[ch.subj].name}」が あらわれた!`,3000),300);}
function runSlot(i,b){const done=()=>finishSlot(i),k=slotSubj(b.k),bk=()=>ttScreen();
 if(k==='rest')go(()=>rest(b.min,done));
 else if(['math','jp','sci','soc','eng'].includes(k))studySubj(k,done,bk);

function toyCompass(el){el.className='toy';const D=[['{北|きた}',0],['{北東|ほくとう}',45],['{東|ひがし}',90],['{南東|なんとう}',135],['{南|みなみ}',180],['{南西|なんせい}',225],['{西|にし}',270],['{北西|ほくせい}',315]];let score=0,q=D[pick([0,2,4,6])];

function toyCircuit(el){el.className='toy';const mats=[['{鉄|てつ}の くぎ',1],['{木|き}の はし',0],['アルミはく',1],['ゴム',0],['10{円玉|えんだま}',1]];let m=null,sw=false;

  <div class="left">${m===null?R('すきまに ものを はさもう'):!sw?R('スイッチを {入|い}れて みよう'):on?R('{明|あ}かりが ついた! {電気|でんき}を {通|とお}すよ'):R('つかない… {電気|でんき}を {通|とお}さない')}</div>`;
  el.querySelector('#sw').onclick=()=>{sw=!sw;SND.tap();draw();};el.querySelectorAll('[data-m]').forEach(b=>b.onclick=()=>{m=+b.dataset.m;SND.tap();draw();});};draw();}

<script>
/* ===== 問題セット ===== */
function makeQs(secs,n){const order=[];while(order.length<n)order.push(...shuffle(secs));
 return order.slice(0,n).map((s,i)=>Object.assign(GEN[s](Math.min(4,Math.floor(i*5/n))),{sec:s}));}
const PRAISE=['せいかい!','すごい!','やったね!','ばっちり!','その ちょうし!','てんさい!'];
let Q=null;
function runSet(cfg){MODE='study';Q=Object.assign({i:0,score:0,res:[],combo:0,coins:0,xp:0},cfg);
 if(cfg.boss){Q.hp=100;Q.hearts=3;}
 renderQ();}
function curQ(){if(Q.boss&&Q.i>=Q.qs.length)Q.qs.push(...Q.more(5));return Q.qs[Q.i];}
function renderQ(){
 const q=curQ();Q.tries=0;Q.done=false;Q.inputs=null;
 const head=Q.boss?`<div class="arena"><div><div class="bname">${R(BOSSES[Q.boss].name)}</div><div class="hp"><i style="width:${Q.hp}%"></i></div><div class="hearts">${[0,1,2].map(j=>HEART(j<Q.hearts)).join('')}</div></div><div id="mon">${monster(Q.boss)}</div></div>`
  :`<div class="dots">${Q.qs.map((_,j)=>`<span class="dot ${Q.res[j]===true?'ok':Q.res[j]===false?'ng':j===Q.i?'now':''}"></span>`).join('')}</div>`;
 app.innerHTML=`<div class="topbar">${back('やめる')}${Q.boss?'':head}<span class="chip">${COIN} ${S.coins}</span></div>${Q.boss?head:''}
 <div class="qcard" style="--ac:${Q.color||'#2F8F6B'}"><div class="qhead"><span class="lvname">${R(Q.title)}${Q.combo>=2?` <span class="combo">${Q.combo} コンボ!</span>`:''}</span><button class="btn small" id="spk">よみあげ</button></div><div id="qbody" class="stack"></div></div>
 <div id="fb" class="fb" hidden></div>`;
 bindBack(Q.back||home);
 $('#spk').onclick=()=>q.audio?sayEN(q.audio):say(q.speak||((q.prompt||'')+'。'+(q.eq||'').replace(/<[^>]+>/g,' ')));
 const host=$('#qbody');
 if(q.type==='input')renderInput(q,host);
 else if(q.type==='share'||q.type==='group')renderToyQ(q,host);
 else if(q.type==='choice')renderChoice(q,host);
 else if(q.type==='word'){q.step=1;renderWord(q);}
}
function padHTML(noOk){return `<div class="pad">${[1,2,3,4,5,6,7,8,9].map(n=>`<button class="key" data-k="${n}">${n}</button>`).join('')}<button class="key sub" data-k="del">けす</button><button class="key" data-k="0">0</button>${noOk?'<span></span>':R('<button class="key ok" data-k="ok">{答|こた}え<br>あわせ</button>')}</div>${noOk?'':`<div class="row center"><button class="btn ghost small" id="hintBtn">ヒントを {見|み}る</button></div>`}`.replace('ヒントを {見|み}る',R('ヒントを {見|み}る'));}
function eqHTML(eq){return `<div class="eq">${R(eq).replace(/%(\d)/g,(m,n)=>`<button class="box" data-i="${n}" aria-label="こたえ"></button>`)}</div>`;}
function mountPad(q,onFull){
 Q.inputs=q.answers.map(()=> '');Q.active=0;updBoxes();
 $$('.box').forEach(b=>b.onclick=()=>{Q.active=+b.dataset.i;updBoxes();});
 $$('.key').forEach(b=>b.onclick=()=>{if(Q.done)return;const k=b.dataset.k;SND.tap();
  if(k==='ok'){const e=Q.inputs.findIndex(v=>v==='');if(e>=0){Q.active=e;updBoxes();return;}check(q);return;}
  if(k==='del'){if(Q.inputs[Q.active]===''&&Q.active>0)Q.active--;Q.inputs[Q.active]=Q.inputs[Q.active].slice(0,-1);}
  else if(Q.inputs[Q.active].length<5){Q.inputs[Q.active]=(Q.inputs[Q.active]+k).replace(/^0+(?=\d)/,'');
   if(Q.inputs.length>1&&Q.active<Q.inputs.length-1&&String(q.answers[Q.active]).length===Q.inputs[Q.active].length)Q.active++;}
  updBoxes();if(onFull)onFull();});
 const hb=$('#hintBtn');if(hb)hb.onclick=()=>showHint(q);
}
function updBoxes(){$$('.box').forEach(b=>{const i=+b.dataset.i;b.textContent=Q.inputs[i];b.classList.toggle('on',i===Q.active);b.classList.toggle('filled',Q.inputs[i]!=='');});}
function renderInput(q,host){host.innerHTML=`${R(q.visual||'')}<p class="prompt">${R(q.prompt)}</p>${eqHTML(q.eq)}${padHTML()}`;mountPad(q);}
function renderToyQ(q,host){host.innerHTML=`<p class="prompt">${R(q.prompt)}</p><div id="toy"></div>${eqHTML(q.eq)}${padHTML()}`;
 if(q.type==='share')toyShare($('#toy'),q.total,q.k,q.icon);else toyGroup($('#toy'),q.total,q.size,q.icon);mountPad(q);}
function renderChoice(q,host){
 host.innerHTML=`${R(q.visual||'')}${q.audio?`<div class="row center"><button class="btn primary" id="play" style="font-size:1.2em">▶ ${R('{音|おと}を {聞|き}く')}</button></div>`:''}<p class="prompt">${R(q.prompt)}</p><div class="choices ${q.ops?'ops':''}">${q.options.map((o,i)=>`<button class="choice" data-o="${i}">${R(o.h)}</button>`).join('')}</div><div class="row center"><button class="btn ghost small" id="hintBtn">${R('ヒントを {見|み}る')}</button></div>`;
 $$('#qbody .choice').forEach(b=>b.onclick=()=>{if(Q.done)return;const o=q.options[+b.dataset.o];b.classList.add(o.ok?'yes':'no');
  if(!o.ok&&!Q.boss&&!Q.test&&Q.tries===0&&q.options.length>2){Q.tries++;SND.bad();tryAgain(q);return;}
  result(o.ok,q,P(o.h));});
 $('#hintBtn').onclick=()=>showHint(q);
 if(q.audio){$('#play').onclick=()=>sayEN(q.audio);setTimeout(()=>sayEN(q.audio),350);}}
/* 文章題 4ステップ */
const STEPN=['{読|よ}む','えらぶ','{式|しき}','{答|こた}え'];
function renderWord(q){
 const host=$('#qbody');
 host.innerHTML=`<div class="problem">${H(q.s)}</div><div class="stepper">${STEPN.map((n,j)=>`<span class="st ${j+1<q.step?'done':j+1===q.step?'now':''}">${j+1} ${R(n)}</span>`).join('')}</div><div id="sb" class="stack"></div>`;
 const sb=$('#sb');
 const note=t=>{let n=sb.querySelector('.note');if(!n){n=document.createElement('p');n.className='note';sb.appendChild(n);}n.innerHTML=R(t);};
 if(q.step===1){
  sb.innerHTML=`<p class="prompt">${R('{何|なに}を きかれて いるかな? (<span style="border-bottom:4px solid var(--coral)">{赤|あか}い {線|せん}</span>が ヒント)')}</p><div class="choices">${q.asks.map((a,i)=>`<button class="choice" data-i="${i}">${R(a)}</button>`).join('')}</div>`;
  $$('#sb .choice').forEach(b=>b.onclick=()=>{if(q.asks[+b.dataset.i]===q.ask){SND.good();q.step=2;renderWord(q);}else{SND.bad();b.classList.add('no');note('もんだいの さいごの {文|ぶん}を もう{一度|いちど} {読|よ}んで みよう。');}});
 }else if(q.step===2){
  sb.innerHTML=`<p class="prompt">${R('どの {計算|けいさん}を つかう?')}</p><div class="choices ops">${['+','−','×','÷'].map(o=>`<button class="choice" data-o="${o}">${o}</button>`).join('')}</div>`;
  $$('#sb .choice').forEach(b=>b.onclick=()=>{if(b.dataset.o===q.op){SND.good();q.step=3;renderWord(q);}else{SND.bad();b.classList.add('no');note('きいろい {線|せん}の ことばを {見|み}てね。'+OPHINT[q.op]);}});
 }else if(q.step===3){
  q.slots=[null,null];
  const draw=()=>{sb.innerHTML=`<p class="prompt">${R('{数|かず}を タップして {式|しき}を つくろう')}</p><div class="slots">${q.slots.map((s,i)=>`<button class="slot ${s!==null?'filled':''}" data-s="${i}">${s!==null?q.nums[s]:''}</button>`).join(`<span>${q.op}</span>`)}</div><div class="numchips">${q.nums.map((n,i)=>`<button class="numchip ${q.slots.includes(i)?'used':''}" data-n="${i}">${n}</button>`).join('')}</div><div class="row center"><button class="btn go" id="okx" ${q.slots.includes(null)?'disabled':''}>これで いい</button></div>`;
   $$('.numchip').forEach(b=>b.onclick=()=>{const e=q.slots.indexOf(null);if(e<0)return;SND.tap();q.slots[e]=+b.dataset.n;draw();});
   $$('.slot').forEach(b=>b.onclick=()=>{q.slots[+b.dataset.s]=null;draw();});
   $('#okx').onclick=()=>{const inOrder=q.slots[0]===0&&q.slots[1]===1,ok=inOrder||((q.op==='+'||q.op==='×')&&q.slots[0]===1);
    if(ok){SND.good();q.step=4;renderWord(q);}else{SND.bad();q.slots=[null,null];draw();note(q.op==='÷'?'わられる {数|かず}({大|おお}きい ほう)を さきに {書|か}くよ。':'もとの {数|かず}({大|おお}きい ほう)から ひくよ。');}};};
  draw();
 }else{
  const [x,y]=q.slots[0]===1?[q.nums[1],q.nums[0]]:q.nums;
  sb.innerHTML=`<p class="prompt">${R('{計算|けいさん}しよう')}</p>${eqHTML(`${x} ${q.op} ${y} = %0 <span class="unit">${q.unit}</span>`)}${padHTML()}`;
  mountPad(q);
 }
}
function showHint(q){const fb=$('#fb');fb.hidden=false;fb.className='fb try';fb.innerHTML=`<div class="fbrow"><div class="face">${OWL()}</div><div><p class="big">ヒント</p><div>${R(q.hint)}</div></div></div>`;fb.scrollIntoView({behavior:'smooth',block:'nearest'});}
function tryAgain(q){const fb=$('#fb');fb.hidden=false;fb.className='fb try';fb.innerHTML=`<div class="fbrow"><div class="face">${OWL()}</div><div><p class="big">おしい! もう{一度|いちど}</p><div>${R(q.hint)}</div></div></div>`.replace('もう{一度|いちど}',R('もう{一度|いちど}'));fb.scrollIntoView({behavior:'smooth',block:'nearest'});}
function check(q){const ok=q.answers.every((a,i)=>Number(Q.inputs[i])===a);
 if(!ok&&!Q.boss&&!Q.test&&Q.tries===0){Q.tries++;SND.bad();tryAgain(q);Q.inputs=Q.inputs.map(()=> '');Q.active=0;updBoxes();return;}
 result(ok,q,Q.inputs.join(' / '));}
function stat(sec,ok){const s=S.drill[sec]||(S.drill[sec]={ok:0,n:0});s.n++;if(ok)s.ok++;}
function result(ok,q,u){
 Q.done=true;$('#qbody').classList.add('locked');const fb=$('#fb');fb.hidden=false;
 stat(q.sec||'etc',ok);Q.res[Q.i]=ok;
 if(ok){Q.score++;Q.combo++;S.bestCombo=Math.max(S.bestCombo||0,Q.combo);const c=3+(Q.combo>=3?2:0);Q.coins+=c;Q.xp+=10;gain(10,c);SND.good();
  if(Q.review)S.miss=S.miss.filter(m=>m.text!==q.text);
  if(Q.boss){const dmg=Q.combo>=3?15:10;Q.hp=Math.max(0,Q.hp-dmg);SND.hit();const m=$('#mon');if(m){m.classList.add('hit');}$('.hp i').style.width=Q.hp+'%';}
  fb.className='fb good';fb.innerHTML=`<div class="fbrow"><div class="face">${OWL()}</div><div><p class="big">${pick(PRAISE)} ${Q.combo>=3?`<span class="combo">${Q.combo}コンボ</span>`:''}</p><p>${R(q.explain)}</p><p class="chip">${COIN} +${c}</p></div></div>`;
 }else{Q.combo=0;SND.bad();
  if(!Q.review||!S.miss.some(m=>m.text===q.text)){S.miss.unshift(Object.assign({},q,{d:today(),u}));S.miss=S.miss.filter((m,j,a)=>a.findIndex(x=>x.text===m.text)===j).slice(0,60);}
  if(Q.boss){Q.hearts--;$('.hearts').innerHTML=[0,1,2].map(j=>HEART(j<Q.hearts)).join('');}
  fb.className='fb miss';fb.innerHTML=`<div class="fbrow"><div class="face">${OWL()}</div><div><p class="big">${R('{答|こた}えを {見|み}て おぼえよう')}</p><div>${R(q.explain)}</div><p class="muted">${R('この {問題|もんだい}は「ふくしゅう」に {入|い}れたよ。')}</p></div></div>`;
 }
 save();
 const end=Q.boss?(Q.hp<=0||Q.hearts<=0):Q.i>=Q.qs.length-1;
 fb.insertAdjacentHTML('beforeend',`<button class="btn primary" id="next">${end?R('けっかを {見|み}る'):R('つぎの {問題|もんだい}')}</button>`);
 $('#next').onclick=()=>{if(end)finishSet();else{Q.i++;renderQ();}};
 fb.scrollIntoView({behavior:'smooth',block:'nearest'});
}
function finishSet(){
 if(Q.test){finishTest();return;}
 syncSoon();
 MODE='menu';const n=Q.boss?Q.i+1:Q.qs.length,r=Q.score/n;
 if(Q.boss){const win=Q.hp<=0;let bonus=0;if(win){const first=!S.boss[Q.boss];S.boss[Q.boss]=true;bonus=first?150:50;gain(100,bonus);}save();
  app.innerHTML=`<div class="result"><div style="width:130px">${win?OWL():monster(Q.boss)}</div><h2>${win?R(BOSSES[Q.boss].name+'を たおした!'):'くやしい! また ちょうせん しよう'}</h2>
   ${win?`<div class="gain"><span class="chip">${COIN} +${Q.coins+bonus}</span><span class="chip">+${Q.xp+100} XP</span></div><p>${R('ずかんに メダルが ふえたよ!')}</p>`:`<p>${R('ヒントを {見|み}たり、{教科書|きょうかしょ}を {読|よ}み{返|かえ}したり してから もう{一度|いちど}!')}</p>`}
   <div class="row center"><button class="btn" id="again">${R('もう{一度|いちど}')}</button><button class="btn go" id="ok">つぎへ</button></div></div>`;
  $('#again').onclick=()=>go(()=>bossBattle(Q.boss,Q.onDone,Q.back));$('#ok').onclick=()=>Q.onDone?Q.onDone():go(bossMenu);return;}
 const st=r>=.9?3:r>=.7?2:r>=.5?1:0;SND.fan();if(Q.score===n){S.perfect=(S.perfect||0)+1;save();}
 const msg=st===3?'パーフェクト!':st===2?'よく できました!':st===1?'クリア! この ちょうし!':R('ふくしゅうで つよく なろう!');
 app.innerHTML=`<div class="result"><div style="width:130px">${OWL()}</div><h2>${msg}</h2><div class="bigstars">${[0,1,2].map(i=>`<span class="pop">${STAR(i<st)}</span>`).join('')}</div><p><b>${Q.score}</b> / ${n}${R('{問|もん} せいかい')}</p>
 <div class="gain"><span class="chip">${COIN} +${Q.coins}</span><span class="chip">+${Q.xp} XP</span></div>
 <div class="row center"><button class="btn go" id="ok">つぎへ</button></div></div>`;
 $('#ok').onclick=()=>Q.onDone?Q.onDone():go(Q.back||home);
}

/* ===== ふくしゅう ===== */
function startReview(secs,n=10,onDone,backFn,fill){
 let pool=S.miss.slice();if(secs)pool=pool.filter(m=>secs.includes(m.sec)||m.sec==='word');
 let qs=shuffle(pool).slice(0,n).map(m=>Object.assign({},m,{step:1}));
 if(fill&&qs.length<n){const rd=allSecs().filter(s=>S.sec[s]);qs=qs.concat(makeQs(rd.length?rd:['s01','j11','e11'],n-qs.length));}
 if(!secs&&!qs.length){app.innerHTML=`<div class="titlebar">${back()}<h2>ふくしゅう</h2></div><div class="result"><div style="width:130px">${OWL()}</div><h2>${R('まちがえた {問題|もんだい}は ないよ!')}</h2><p>${R('{問題集|もんだいしゅう}で どんどん ちょうせん しよう。')}</p></div>`;bindBack(home);return;}
 if(qs.length<n&&secs)qs=qs.concat(makeQs(secs,n-qs.length));
 runSet({title:'ふくしゅう',qs,color:'#C27A2C',review:true,onDone,back:backFn||home});
}

/* ===== ボス ===== */
const BOSSCH={c0:['c0'],c1:['c1'],c2:['c2'],c3:['c3'],c4:['c4'],fin:['c0','c1','c2','c3','c4']};
['jp','sci','soc','eng'].forEach(s=>BOSSCH[s]=CH.filter(c=>c.subj===s).map(c=>c.id));
function bossBattle(id,onDone,backFn){
 const secs=secsOf(BOSSCH[id]);const more=k=>{const qs=makeQs(secs,k);if(id==='c4'||id==='fin')qs.push(Object.assign(wordQ(4)(3),{sec:'word'}));return qs;};
 runSet({title:BOSSES[id].name,boss:id,qs:more(5),more,color:BOSSES[id].color,onDone,back:backFn||bossMenu});
}
function bossMenu(){
 app.innerHTML=`<div class="titlebar">${back()}<h2>ボスバトル</h2><span class="muted">{正|せい}かいで こうげき! まちがえると ハートが へるよ</span></div>
 <div class="menu">${Object.keys(BOSSES).map(id=>`<button class="mbtn" data-b="${id}" style="--ac:${BOSSES[id].color}"><span class="ic" style="width:72px;height:72px">${monster(id).replace('class="monster bob"','style="width:64px;height:64px"')}</span><span><b>${R(BOSSES[id].name)}</b><small>${S.boss[id]?'たおした!':R(id==='fin'?'{算数|さんすう} {全部|ぜんぶ}':BOSSCH[id].length>1||!CH[chIdx(id)]?SUBJ.find(x=>x.id===id).name+' {全部|ぜんぶ}':CH[chIdx(id)].title)}</small></span></button>`).join('')}</div>`.replace('{正|せい}かいで','せいかいで');
 bindBack(home);
 $$('[data-b]').forEach(b=>b.onclick=()=>go(()=>bossBattle(b.dataset.b)));
}

/* ===== ラッシュゲーム ===== */
function gameMenu(){
 app.innerHTML=`<div class="titlebar">${back()}<h2>ゲーム</h2><span class="muted">60びょうで {何問|なんもん} とける?</span></div>
 <div class="menu">${Object.keys(RUSH).map(id=>`<button class="mbtn" data-g="${id}" style="--ac:${RUSH[id].color}"><span class="ic">${IC.game}</span><span><b>${R(RUSH[id].name)}</b><small>${R(RUSH[id].sub)}<br>ハイスコア ${S.rush[id]||0}</small></span></button>`).join('')}</div>`;
 bindBack(home);$$('[data-g]').forEach(b=>b.onclick=()=>go(()=>rushGame(b.dataset.g)));
}
function rushGame(id,onDone,backFn){
 const G=RUSH[id];MODE='study';let left=60,score=0,combo=0,q=null,inp='',over=false,iv=null;
 app.innerHTML=`<div class="topbar">${back('やめる')}<h2 style="font-size:24px">${R(G.name)}</h2><span class="chip">ハイスコア ${S.rush[id]||0}</span></div>
 <div id="stage" class="result"><div style="width:120px">${OWL()}</div><p>${R('60びょうの あいだに、できるだけ たくさん とこう! こたえを {入|い}れると すぐ つぎに すすむよ。')}</p><button class="btn primary" id="start">スタート!</button></div>`;
 bindBack(backFn||gameMenu);$$('[data-back]').forEach(b=>b.addEventListener('click',()=>clearInterval(iv)));
 const next=()=>{q=G.g();inp='';draw();};
 const draw=()=>{const st=$('#stage');if(!st)return;
  st.className='';st.innerHTML=`<div class="rushhead"><span>${R('のこり')}</span><span class="t" id="rt">${left}</span><span class="s">${score}${R('{問|もん}')}${combo>=3?` <span style="color:#F4B63A">${combo}コンボ</span>`:''}</span></div>
  <div class="qcard" style="--ac:${G.color};align-items:center"><div class="eq">${q.say?`<button class="btn primary" id="rplay">▶</button>`:''}${q.eq} ${q.opts?'':`= <span class="box filled on" style="display:inline-block;min-width:2.4em;text-align:center">${inp||'&nbsp;'}</span>`}</div>
  ${q.opts?`<div class="choices" style="width:100%">${q.opts.map(o=>`<button class="choice" data-v="${o}">${R(o)}${q.txt?'':'g'}</button>`).join('')}</div>`:padHTML(true)}</div>`;
  if(q.say){$('#rplay').onclick=()=>sayEN(q.say);if(!q.spoken){q.spoken=1;sayEN(q.say);}}
  if(q.opts)$$('.choice').forEach(b=>b.onclick=()=>answer(q.txt?b.dataset.v===q.ans:+b.dataset.v===q.ans));
  else $$('.key').forEach(b=>b.onclick=()=>{const k=b.dataset.k;if(k==='del')inp=inp.slice(0,-1);else if(k&&inp.length<3)inp+=k;SND.tap();
   if(inp.length>=String(q.ans).length){if(+inp===q.ans)answer(true);else{answer(false);}}else draw();});};
 const answer=ok=>{if(over)return;if(ok){score++;combo++;SND.good();}else{combo=0;SND.bad();}next();};
 const end=()=>{over=true;clearInterval(iv);MODE='menu';const best=S.rush[id]||0,nb=score>best;if(nb)S.rush[id]=score;save();gain(score*5,score*2);SND.fan();
  const st=$('#stage');if(!st)return;st.className='result';st.innerHTML=`<div style="width:120px">${OWL()}</div><h2>${R('タイムアップ!')}</h2><p class="bigeq">${score}${R('{問|もん}')}</p>${nb?`<p class="combo">${R('ハイスコア こうしん!')}</p>`:''}<div class="gain"><span class="chip">${COIN} +${score*2}</span><span class="chip">+${score*5} XP</span></div><div class="row center"><button class="btn" id="again">${R('もう{一度|いちど}')}</button><button class="btn go" id="ok">つぎへ</button></div>`;
  $('#again').onclick=()=>go(()=>rushGame(id,onDone,backFn));$('#ok').onclick=()=>onDone?onDone():go(gameMenu);};
 $('#start').onclick=()=>{next();iv=setInterval(()=>{if(!$('#rt')){clearInterval(iv);return;}left--;$('#rt').textContent=left;if(left<=0)end();},1000);};
}
</script>

function accOf(sec){const d=S.drill[sec]||{ok:0,n:0};let ok=d.ok,n=d.n;Object.values(S.tests||{}).forEach(t=>{const v=(t.sec||{})[sec];if(v){ok+=v[0]*2;n+=v[1]*2;}});return n?ok/n:null;}
function weakSecs(){return allSecs().filter(s=>{const d=S.drill[s]||{n:0};const a=accOf(s);return a!==null&&a<.6&&(d.n>=3||Object.values(S.tests||{}).some(t=>(t.sec||{})[s]));}).sort((a,b)=>accOf(a)-accOf(b));}
function subjAcc(s){const ts=Object.keys(S.tests||{}).sort().slice(-7);let ok=0,n=0;ts.forEach(d=>{const v=(S.tests[d].by||{})[s];if(v){ok+=v[0];n+=v[1];}});
 if(!n)subjSecs(s).forEach(x=>{const d=S.drill[x];if(d){ok+=d.ok;n+=d.n;}});return n?ok/n:null;}
function subjLv(s){const a=subjAcc(s);if(a===null)return 0;return a>=.9?5:a>=.75?4:a>=.6?3:a>=.4?2:1;}

/* ===== 毎日テスト ===== */
function testDone(){return (S.tests||{})[today()];}
function testQs(){const N=SET().testN||15;const read=allSecs().filter(s=>S.sec[s]&&subjMode(subjOf(s))!=='off');
 let pool=read.length>=3?read:SUBJ.filter(x=>subjMode(x.id)!=='off').map(x=>subjSecs(x.id)[0]);
 const w=[];pool.forEach(s=>{let k=1;if(focusSecs().includes(s))k+=2;if(subjMode(subjOf(s))==='focus')k+=1;if(weakSecs().includes(s))k+=2;for(let i=0;i<k;i++)w.push(s);});
 focusSecs().forEach(s=>{if(!pool.includes(s))w.push(s,s);});
 const subs=[...new Set(w.map(subjOf))];const pickList=[];subs.forEach(su=>pickList.push(pick(w.filter(x=>subjOf(x)===su))));
 while(pickList.length<N)pickList.push(pick(w));
 let wordN=0;return shuffle(pickList.slice(0,N)).map((s,i)=>{let q=GEN[s](rand(1,4));if(q.type==='word'){if(wordN>=2)q=GEN.s13(3);else wordN++;}return Object.assign(q,{sec:q.type==='word'&&s==='s43'?'s43':s,step:1});});}
function startDailyTest(onDone,backFn){
 if(testDone()){go(()=>testResult(testDone(),onDone||home));return;}
 app.innerHTML=`<div class="titlebar">${back()}<h2>きょうの テスト</h2></div><div class="result"><div style="width:130px">${OWL()}</div><h2>${R('きょうの ちからだめし!')}</h2>
 <p>${R(`{全部|ぜんぶ}で ${SET().testN||15}{問|もん}。テストでは ヒントは つかえないよ。1{回|かい}で こたえよう。`)}</p><p class="muted">${R('けっかで「にがて」が わかると、つぎの {勉強|べんきょう}で しっかり れんしゅう できるよ。')}</p>
 <button class="btn primary" id="go">テスト スタート</button></div>`;
 bindBack(backFn||home);
 $('#go').onclick=()=>{app.classList.add('testmode');runSet({title:'きょうの テスト',qs:testQs(),color:'#B84A74',test:true,onDone:()=>{},back:()=>{app.classList.remove('testmode');(backFn||home)();},afterTest:onDone||home});};
}
function finishTest(){
 app.classList.remove('testmode');const by={},sec={};Q.qs.forEach((q,i)=>{if(Q.res[i]===undefined)return;const s=q.sec&&SEC[q.sec]?subjOf(q.sec):'math';by[s]=by[s]||[0,0];by[s][1]++;if(Q.res[i])by[s][0]++;if(SEC[q.sec]){sec[q.sec]=sec[q.sec]||[0,0];sec[q.sec][1]++;if(Q.res[i])sec[q.sec][0]++;}});
 const r={score:Q.score,total:Q.qs.length,by,sec};S.tests=S.tests||{};S.tests[today()]=r;const c=Q.score*5;gain(30,c);save();syncSoon(500);
 go(()=>testResult(r,Q.afterTest,c));}
function testResult(r,next,coins){
 const pct=Math.round(r.score/r.total*100);const weak=Object.keys(r.sec).filter(s=>r.sec[s][0]/r.sec[s][1]<.6).slice(0,5);
 const msg=pct>=90?'すばらしい! この ちょうし!':pct>=70?'よく できました!':pct>=50?'あと すこし! にがてを れんしゅう しよう':'だいじょうぶ。にがてが わかったのが {大|おお}きな {一歩|いっぽ}!';
 app.innerHTML=`<div class="titlebar">${back()}<h2>テストの けっか</h2></div><div class="result"><div style="width:120px">${OWL()}</div><h2>${R(msg)}</h2><p class="bigeq">${r.score} / ${r.total}</p>${coins?`<span class="chip">${COIN} +${coins}</span>`:''}
 <h3>${R('{教科|きょうか}ごとの レベル')}</h3><div class="stack" style="width:100%;align-items:center;gap:8px">${SUBJ.map(s=>{const v=r.by[s.id];const lv=subjLv(s.id);return `<div class="lvrow"><b style="color:${s.color}">${R(s.name)}</b><div class="lvbar"><i style="width:${lv*20}%;background:${s.color}"></i></div><span>${lv?'Lv.'+lv:'—'}${v?` <small class="muted">${v[0]}/${v[1]}</small>`:''}</span></div>`;}).join('')}</div>
 ${weak.length?`<h3>${R('つぎに がんばる ところ')}</h3><div class="stack" style="width:100%;max-width:460px;gap:8px">${weak.map(s=>`<div class="row between" style="background:#fff;border-radius:14px;padding:8px 12px"><span>${R(SEC[s].title)}</span><button class="btn small primary" data-rb="${s}">{教科書|きょうかしょ}を {読|よ}む</button></div>`).join('')}</div><p class="muted">${R('{時間|じかん}わりの「にがて こくふく」で れんしゅう できるよ。')}</p>`:''}
 <button class="btn go" id="ok">つぎへ</button></div>`;
 bindBack(home);$('#ok').onclick=()=>go(next||home);
 $$('[data-rb]').forEach(b=>b.onclick=()=>go(()=>bookSec(b.dataset.rb,0,()=>go(home),home)));}

/* ===== にがて こくふく ===== */
function focusQs(n=10){const out=[];const fs=focusSecs(),ws=weakSecs(),fsub=SUBJ.filter(s=>subjMode(s.id)==='focus').map(s=>s.id);
 const rel=m=>!fs.length&&!fsub.length||fs.includes(m.sec)||fsub.includes(SEC[m.sec]?subjOf(m.sec):'math');
 shuffle(S.miss.filter(rel)).slice(0,4).forEach(m=>out.push(Object.assign({},m,{step:1})));
 let pool=fs.concat(ws.filter(s=>!fs.includes(s)));
 if(fsub.length)pool=pool.concat(fsub.flatMap(s=>subjSecs(s).filter(x=>S.sec[x])));
 if(!pool.length)pool=allSecs().filter(s=>S.sec[s]);if(!pool.length)pool=['s01','j11','e11'];
 return out.concat(makeQs(pool,Math.max(0,n-out.length)));}
function focusDesc(){const fs=focusSecs(),ws=weakSecs();if(fs.length)return R('おうちの{人|ひと}が えらんだ ところ + にがて');if(ws.length)return R(`にがて: ${SEC[ws[0]].title}`);return R('まちがえた {問題|もんだい}と ふくしゅう');}

/* ===== スマホへ おくる ===== */
function snapshot(){const d=today();const days=Object.keys(S.time).sort().slice(-30).map(k=>({d:k,sec:S.time[k],slots:k===d?todayDone().filter(Boolean).length:''}));
 if(!days.some(x=>x.d===d))days.push({d,sec:0,slots:todayDone().filter(Boolean).length});
 const tests=Object.keys(S.tests||{}).sort().slice(-30).map(k=>({d:k,score:S.tests[k].score,total:S.tests[k].total,by:S.tests[k].by}));
 return{v:1,name:P(S.name||''),lv:lvInfo(S.xp).l,coins:S.coins,
  today:{d,sec:S.time[d]||0,slots:todayDone().filter(Boolean).length,slotsTotal:TT().length,test:testDone()?{score:testDone().score,total:testDone().total}:null},
  days,tests,
  subj:SUBJ.map(s=>{const a=subjAcc(s.id);return{id:s.id,read:subjSecs(s.id).filter(x=>S.sec[x]).length,total:subjSecs(s.id).length,acc:a===null?null:Math.round(a*100),lv:subjLv(s.id)};}),
  secs:allSecs().map(s=>{const dd=S.drill[s]||{ok:0,n:0};let ok=dd.ok,n=dd.n;Object.values(S.tests||{}).forEach(t=>{const v=(t.sec||{})[s];if(v){ok+=v[0];n+=v[1];}});return{id:s,s:subjOf(s),t:P(SEC[s].title),read:!!S.sec[s],ok,n};}),
  miss:S.miss.slice(0,20).map(m=>({d:m.d,t:String(m.text||'').slice(0,60),a:String(m.ansText||''),u:String(m.u||'')}))};}
let syncT=null;
function syncSoon(ms=3000){clearTimeout(syncT);syncT=setTimeout(syncNow,ms);}
function syncNow(){const L=S.link;if(!L||!L.url)return Promise.resolve(false);
 return fetch(L.url,{method:'POST',headers:{'Content-Type':'text/plain;charset=utf-8'},body:JSON.stringify({key:L.key,snapshot:snapshot()})})
 .then(r=>r.json()).then(j=>{if(j.ok){L.last=Date.now();L.err='';if(j.settings){const old=JSON.stringify(S.remote||{});S.remote=j.settings;if(JSON.stringify(j.settings)!==old&&old!=='{}')toast('おうちの{人|ひと}の せっていが かわったよ');}save();return true;}L.err=j.err||'error';save();return false;})
 .catch(e=>{L.err=String(e.message||e);save();return false;});}
setInterval(()=>{if(document.visibilityState==='visible')syncNow();},5*60*1000);
document.addEventListener('visibilitychange',()=>{if(document.visibilityState==='visible')syncSoon(1500);});
/* 連携コード(URL|キー) */
function parseLink(code){code=String(code||'').trim();const m=code.match(/(https:\/\/script\.google\.com\/macros\/s\/[A-Za-z0-9_-]+\/exec)[^|]*\|?\s*([A-Za-z0-9]+)?/);if(!m)return null;
 let key=m[2];if(!key){const k=code.match(/[?&]key=([A-Za-z0-9]+)/);key=k&&k[1];}return key?{url:m[1],key}:null;}
(function(){try{const q=new URLSearchParams(location.search).get('link');if(q){const l=parseLink(decodeURIComponent(q));if(l){S.link=l;save();history.replaceState(null,'',location.pathname);setTimeout(()=>toast('スマホと つながりました'),800);}}}catch(e){}})();

/*ADULT*/
function linkPanel(){const L=S.link;const st=SET();
 return `<div class="panel"><b>スマホで学習状況を見る（保護者連携）</b>
 ${L&&L.url?`<p class="muted">連携中です。最終送信: ${L.last?new Date(L.last).toLocaleString('ja-JP'):'まだ'}${L.err?`<br><span style="color:var(--coral)">送信エラー: ${esc(L.err)}</span>`:''}</p><div class="row"><button class="btn small go" id="lsync">今すぐ送る</button><button class="btn small ghost" id="lcut">連携を解除</button></div>`:
 `<p class="muted">保護者ページ（スマホ）に表示される「連携コード」をここに貼り付けてください。</p><textarea id="lcode" rows="3" style="width:100%;font:inherit;font-size:14px;border-radius:12px;border:2px solid var(--line);padding:8px" placeholder="https://script.google.com/macros/s/…/exec|キー"></textarea><div class="row"><button class="btn small go" id="lset">連携する</button><span id="lmsg" class="muted"></span></div>`}</div>
 <div class="panel"><b>重点にする教科・単元</b>${L&&L.url?'<p class="muted">連携中はスマホの保護者ページで設定します。現在の設定：'+SUBJ.map(s=>P(s.name)+'＝'+({focus:'重点',normal:'ふつう',off:'休み'}[subjMode(s.id)])).join('／')+'、重点単元 '+focusSecs().length+'件、テスト '+(st.testN||15)+'問</p>':
 `<p class="muted">重点：テストと「にがてこくふく」で優先して出題。休み：時間わりから外します。</p>${SUBJ.map(s=>`<div class="row between"><span>${P(s.name)}</span><div class="seg" data-fs="${s.id}">${[['focus','重点'],['normal','ふつう'],['off','休み']].map(([v,t])=>`<button data-v="${v}" class="${subjMode(s.id)===v?'on':''}">${t}</button>`).join('')}</div></div>`).join('')}
 <div class="row between"><span>毎日テストの問題数</span><div class="seg" id="ltn">${[10,15,20].map(n=>`<button data-v="${n}" class="${(st.testN||15)===n?'on':''}">${n}問</button>`).join('')}</div></div>
 <details><summary class="muted">重点単元を選ぶ（${focusSecs().length}件）</summary>${SUBJ.map(s=>`<div style="margin-top:6px"><b>${P(s.name)}</b>${subjSecs(s.id).map(x=>`<label style="display:flex;gap:8px;align-items:center;font-size:.85em"><input type="checkbox" data-fsec="${x}" ${focusSecs().includes(x)?'checked':''} style="width:20px;height:20px">${P(SEC[x].title)}</label>`).join('')}</div>`).join('')}</details>`}</div>`;}
function bindLink(){const L=S.link;
 if($('#lset'))$('#lset').onclick=()=>{const l=parseLink($('#lcode').value);if(!l){$('#lmsg').textContent='コードを読み取れませんでした';return;}S.link=l;save();$('#lmsg').textContent='送信テスト中…';syncNow().then(ok=>{$('#lmsg').textContent=ok?'連携しました':'送信できませんでした（URLとキーを確認してください）';setTimeout(parent,1200);});};
 if($('#lsync'))$('#lsync').onclick=()=>syncNow().then(()=>parent());
 if($('#lcut'))$('#lcut').onclick=()=>{S.link=null;S.remote=null;save();parent();};
 const ls=()=>{S.localSet=S.localSet||{};return S.localSet;};
 $$('[data-fs]').forEach(g=>g.querySelectorAll('button').forEach(b=>b.onclick=()=>{const o=ls();o.subj=o.subj||{};o.subj[g.dataset.fs]=b.dataset.v;save();parent();}));
 $$('#ltn button').forEach(b=>b.onclick=()=>{ls().testN=+b.dataset.v;save();parent();});
 $$('[data-fsec]').forEach(c=>c.onchange=()=>{const o=ls();o.secs=$$('[data-fsec]').filter(x=>x.checked).map(x=>x.dataset.fsec);save();});}
/*ENDADULT*/
</script>
<script>
/* ===== ショップ ===== */
function shop(){
 const slotName={hat:'ぼうし',face:'めがね',neck:'くび'};
 app.innerHTML=statusBar()+`<div class="titlebar">${back()}<h2>ショップ</h2><span class="muted">コインで ホーちゃんを きせかえ</span></div>
 <div class="hero" style="grid-template-columns:auto 1fr"><div class="partner">${OWL()}</div><div class="say">${R('どれが にあうかな? {買|か}った ものは タップで つけたり はずしたり できるよ。')}</div></div>
 <div class="shop">${ITEMS.map(it=>{const own=S.owned.includes(it.id),on=S.eq[it.slot]===it.id;
  return `<div class="item ${on?'on':''}">${OWL(Object.assign({hat:null,face:null,neck:null},{[it.slot]:it.id}))}<b>${R(it.name)}</b><span class="muted">${slotName[it.slot]}</span>
  ${own?`<button class="btn small ${on?'':'go'}" data-eq="${it.id}">${on?'はずす':'つける'}</button>`:`<button class="btn small primary" data-buy="${it.id}" ${S.coins<it.price?'disabled':''}><span class="pr">${it.price}</span> コイン</button>`}</div>`;}).join('')}</div>`;
 bindBack(home);
 $$('[data-buy]').forEach(b=>b.onclick=()=>{const it=ITEMS.find(x=>x.id===b.dataset.buy);if(S.coins<it.price)return;S.coins-=it.price;S.owned.push(it.id);S.eq[it.slot]=it.id;save();SND.coin();toast(`${it.name}を {買|か}ったよ!`);shop();});
 $$('[data-eq]').forEach(b=>b.onclick=()=>{const it=ITEMS.find(x=>x.id===b.dataset.eq);S.eq[it.slot]=S.eq[it.slot]===it.id?null:it.id;save();SND.tap();shop();});

/* ===== ずかん ===== */

function zukan(){
 const tier=v=>v>=30?['#F4B63A','きん']:v>=20?['#A7B4BA','ぎん']:v>=10?['#C27A2C','どう']:null;

 <div class="stack"><div class="panel"><h3>ふしぎカード</h3><p class="muted">{教科書|きょうかしょ}を {読|よ}みおわると もらえるよ</p><div class="stack" style="gap:10px">${allSecs().filter(s=>SEC[s].card).map(s=>S.sec[s]?fcard(SEC[s].card,false).replace('pop',''):`<div class="fcard" style="opacity:.45;filter:grayscale(1)"><div class="fct">?</div><b>${R(SEC[s].title)}</b><p>${R('{読|よ}むと もらえる')}</p></div>`).join('')}</div></div>

 <div class="panel"><h3>ボス メダル</h3><div class="zk">${Object.keys(BOSSES).map(id=>`<div class="c ${S.boss[id]?'':'no'}">${monster(id).replace('class="monster bob"','')}<span>${S.boss[id]?R(BOSSES[id].name):'?'}</span></div>`).join('')}</div></div>
 <div class="panel"><h3>ゲーム メダル</h3><p class="muted">10{問|もん}で どう、20{問|もん}で ぎん、30{問|もん}で きん</p><div class="zk">${Object.keys(RUSH).map(id=>{const t=tier(S.rush[id]||0);return `<div class="c ${t?'':'no'}">${MEDAL(t?t[0]:'#999',t?t[1]:'')}<span>${R(RUSH[id].name)}<br>${S.rush[id]||0}{問|もん}</span></div>`;}).join('')}</div></div>
 <div class="panel"><h3>きろく</h3><div class="itbl"><span>さいこう コンボ</span><span>${S.bestCombo||0}</span><span>{全部|ぜんぶ}の {勉強|べんきょう}{時間|じかん}</span><span>${R(jpT(Object.values(S.time).reduce((a,b)=>a+b,0)))}</span></div></div></div>`;
 bindBack(home);
}

/*ADULT*/
const SLOTOPT=['test','math','jp','sci','soc','scisoc','eng','focus','word','game','review','rest'];
function parent(){
 const days=Object.keys(S.time).sort().reverse().slice(0,14);
 const L=TT().map(x=>Object.assign({},x));const total=L.reduce((a,b)=>a+b.min,0);
 const subjRows=SUBJ.map(s=>{const secs=subjSecs(s.id);let ok=0,n=0;secs.forEach(x=>{const d=S.drill[x];if(d){ok+=d.ok;n+=d.n;}});return `<tr><td>${P(s.name)}</td><td>${secs.filter(x=>S.sec[x]).length} / ${secs.length}節</td><td>${ok} / ${n}${n?`（${Math.round(ok/n*100)}%）`:''}</td><td>${S.boss[s.id==='math'?'fin':s.id]?'撃破':'—'}</td></tr>`;}).join('');
 const secRows=allSecs().map(s=>{const d=S.drill[s]||{ok:0,n:0};return `<tr><td>${P(SUBJ.find(x=>x.id===subjOf(s)).name)}</td><td>${P(SEC[s].title)}</td><td>${S.sec[s]?'読了':'—'}</td><td>${d.ok} / ${d.n}</td></tr>`;}).join('');
 app.innerHTML=`<div class="titlebar">${back()}<h2>おうちの方へ</h2></div>
 <div class="stack">
  <div class="panel"><b>このアプリの使い方</b><p class="muted">小学3年の算数・国語・理科・社会・英語（外国語活動）を、「教科書（読む・さわる・クイズ）→問題」の順で学べます。<br>
  ・ホームの「きょうの時間わり」を上から進めると、各教科を交えて1日約3時間になります。コマの内容は下の「時間わりの設定」で変えられます。<br>
  ・各教科のコマでは、まだ読んでいない次の節の教科書を読み、続けてその節の問題を解きます。全節を読み終えた教科は、まぜまぜドリルになります。<br>
  ・「理科・社会（日がわり）」のコマは、日によって理科と社会が交互に入ります。ゲームのコマは日ごとに種類が変わります。<br>
  ・理科・社会・英語は基礎知識がなくても進められるよう、キャラクターの会話、さわって確かめる図、「やってみよう（家でできる観察・体験）」、読み終えるともらえる「ふしぎカード」（豆知識）を入れています。英語はカードや問題の音声を聞いて進めます。<br>
  ・間違えた問題は自動で「ふくしゅう」に入り、正解すると消えます。勉強時間は教科書・問題・ゲームの画面を開いている間だけ数えます。記録はこのiPadのブラウザ内にだけ保存されます。</p></div>
  ${linkPanel()}
  <div class="panel"><b>時間わりの設定</b><p class="muted">コマの教科と時間を変えられます。合計 <b id="tttot">${total}</b> 分（目安 180分）</p>
   <div class="stack" style="gap:8px" id="ttlist">${L.map((x,i)=>`<div class="ttrow"><span>${i+1}</span><select data-k="${i}">${SLOTOPT.map(k=>`<option value="${k}" ${x.k===k?'selected':''}>${P(SLOT[k].name)}</option>`).join('')}</select><select data-m="${i}">${[10,15,20,25,30,40].map(m=>`<option ${x.min===m?'selected':''}>${m}</option>`).join('')}</select><button class="btn small ghost" data-del="${i}">削除</button></div>`).join('')}</div>
   <div class="row"><button class="btn small" id="ttadd">コマを追加</button><button class="btn small go" id="ttsave">保存する</button><button class="btn small ghost" id="ttdef">おすすめに戻す</button><span id="ttmsg" class="muted"></span></div></div>
  <div class="panel"><b>設定</b>
   <div><div class="muted">ふりがな</div><div class="seg" id="furi">${[['all','すべての漢字'],['2','2・3年の漢字（おすすめ）'],['3','3年の漢字だけ'],['none','なし']].map(([v,t])=>`<button data-v="${v}" class="${S.furi===v?'on':''}">${t}</button>`).join('')}</div></div>
   <div><div class="muted">効果音</div><div class="seg" id="snd"><button data-v="1" class="${S.sound?'on':''}">オン</button><button data-v="0" class="${S.sound?'':'on'}">オフ</button></div></div>
   <div class="row"><span class="muted">名前: ${S.name}</span><button class="btn small" id="rename">名前を変える</button></div></div>
  <div class="panel"><b>勉強時間</b>${days.length?`<div class="tbl"><table><thead><tr><th>日付</th><th>勉強時間</th><th>目標比</th></tr></thead><tbody>${days.map(d=>`<tr><td>${d}</td><td>${P(jpT(S.time[d]))}</td><td>${Math.round(S.time[d]/(total*60)*100)}%</td></tr>`).join('')}</tbody></table></div>`:'<p class="muted">まだ記録がありません。</p>'}</div>
  <div class="panel"><b>教科ごとの進み具合</b><div class="tbl"><table><thead><tr><th>教科</th><th>教科書</th><th>正解 / 解いた数</th><th>ボス</th></tr></thead><tbody>${subjRows}</tbody></table></div>
   <details><summary class="muted">節ごとの記録を見る</summary><div class="tbl"><table><thead><tr><th>教科</th><th>節</th><th>教科書</th><th>正解/解いた数</th></tr></thead><tbody>${secRows}</tbody></table></div></details>
   <p class="muted">レベル ${lvInfo(S.xp).l} ・ コイン ${S.coins}</p></div>
  <div class="panel"><b>まちがえた問題（新しい順）</b>${S.miss.length?`<div class="tbl"><table><thead><tr><th>日付</th><th>問題</th><th>正しい答え</th><th>入力</th></tr></thead><tbody>${S.miss.slice(0,40).map(m=>`<tr><td>${m.d||''}</td><td style="white-space:normal;min-width:220px">${esc(m.text)}</td><td>${esc(m.ansText)}</td><td>${esc(m.u||'')}</td></tr>`).join('')}</tbody></table></div>`:'<p class="muted">ありません。</p>'}</div>
  <div class="panel"><b>記録のリセット</b><p class="muted">名前と時間わりの設定以外の記録（コイン・レベル・進み具合）を消します。</p><div class="row"><button class="btn red" id="rst">リセットする</button><span id="rstc"></span></div></div>
 </div>`;
 bindBack(home);bindLink();
 const tot=()=>{$('#tttot').textContent=L.reduce((a,b)=>a+b.min,0);};
 $$('[data-k]').forEach(s=>s.onchange=()=>{L[+s.dataset.k].k=s.value;});
 $$('[data-m]').forEach(s=>s.onchange=()=>{L[+s.dataset.m].min=+s.value;tot();});
 $$('[data-del]').forEach(b=>b.onclick=()=>{if(L.length<=1)return;L.splice(+b.dataset.del,1);S.tt=L;save();parent();});
 $('#ttadd').onclick=()=>{L.push({k:'math',min:20});S.tt=L;save();parent();};
 $('#ttsave').onclick=()=>{S.tt=L;S.today=null;save();$('#ttmsg').textContent='保存しました';};
 $('#ttdef').onclick=()=>{S.tt=null;S.today=null;save();parent();};
 $$('#furi button').forEach(b=>b.onclick=()=>{S.furi=b.dataset.v;document.body.dataset.furi=S.furi;save();parent();});
 $$('#snd button').forEach(b=>b.onclick=()=>{S.sound=b.dataset.v==='1';save();parent();});
 $('#rename').onclick=()=>nameScreen(parent);
 $('#rst').onclick=()=>{$('#rstc').innerHTML='<button class="btn small red" id="y">本当に消す</button> <button class="btn small ghost" id="n">やめる</button>';
  $('#y').onclick=()=>{const n=S.name,f=S.furi,t=S.tt;S=blank();S.name=n;S.furi=f;S.tt=t;save();parent();};$('#n').onclick=()=>{$('#rstc').innerHTML='';};};
}
/*ENDADULT*/

/* ふりがな記法が そのまま 出ないように 自動で 変かん */
function fixRuby(root){const w=document.createTreeWalker(root,NodeFilter.SHOW_TEXT),list=[];let n;
 while((n=w.nextNode()))if(/\{[^|{}]+\|[^{}]+\}/.test(n.nodeValue)&&!n.parentNode.closest('script,style,svg'))list.push(n);
 list.forEach(t=>{const sp=document.createElement('span');sp.innerHTML=R(esc(t.nodeValue).replace(/&amp;/g,'&'));t.replaceWith(...sp.childNodes);});}
new MutationObserver(()=>fixRuby(app)).observe(app,{childList:true,subtree:true});

/* 起動 */
if(!S.name)nameScreen(home);else home();
syncSoon(2500);
</script>

</body>
</html>
