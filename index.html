<style>
*,*::before,*::after{box-sizing:border-box}
:root{padding-top:env(safe-area-inset-top,0px);padding-bottom:env(safe-area-inset-bottom,0px)}
body{margin:0;-webkit-text-size-adjust:100%}
img{max-width:100%}
[hidden]{display:none!important}
</style>
<title>さんすうたんけん</title>
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link rel="stylesheet" href="https://fonts.googleapis.com/css2?family=Mochiy+Pop+One&family=Zen+Maru+Gothic:wght@500;700;900&display=swap">
<style>
:root{
  --sky:#D7EEF3; --paper:#FFFBF1; --page:#FFFDF7; --ink:#1F3A4A; --ink2:#4F6B78; --line:#BCD7DE;
  --leaf:#2F8F6B; --sun:#F4B63A; --coral:#E4684F; --sea:#3E6FB5; --clay:#C27A2C; --grape:#7A5BB5;
  --goodbg:#E3F4EA; --trybg:#FFF3D6; --missbg:#FCE6E1;
  color-scheme: light;
}
html,body{background:var(--sky)}
body{color:var(--ink);font-family:"Zen Maru Gothic","Hiragino Maru Gothic ProN","Hiragino Sans",sans-serif;font-size:20px;font-weight:500;line-height:1.7}
.wrap{max-width:920px;margin:0 auto;padding-inline:16px;padding-block:12px 64px}
h1,h2,h3,.disp{font-family:"Mochiy Pop One","Zen Maru Gothic",sans-serif;font-weight:400;text-wrap:balance;margin:0;line-height:1.5}
p{margin:0}
ruby rt{font-size:.52em;font-weight:700;color:var(--ink2);letter-spacing:0}
body[data-furi="2"] ruby.g1 rt,
body[data-furi="3"] ruby.g1 rt, body[data-furi="3"] ruby.g2 rt,
body[data-furi="none"] ruby rt{display:none}
button{font:inherit;color:inherit;touch-action:manipulation;-webkit-tap-highlight-color:transparent;cursor:pointer}
button:focus-visible{outline:4px solid var(--sea);outline-offset:3px}
input{font:inherit}
.btn{border:0;border-radius:18px;padding:.5em 1.1em;background:var(--paper);box-shadow:0 4px 0 var(--line);font-weight:700;min-height:56px}
.btn:active{transform:translateY(3px);box-shadow:0 1px 0 var(--line)}
.btn.primary{background:var(--sun);box-shadow:0 4px 0 #C98F1F}
.btn.go{background:var(--leaf);color:#fff;box-shadow:0 4px 0 #1E6A4E}
.btn.red{background:var(--coral);color:#fff;box-shadow:0 4px 0 #B24A35}
.btn.ghost{background:transparent;box-shadow:none;border:3px solid var(--line)}
.btn.small{min-height:44px;padding:.25em .9em;font-size:.85em}
.btn[disabled]{opacity:.4;pointer-events:none}
.row{display:flex;flex-wrap:wrap;align-items:center;gap:12px}
.between{justify-content:space-between}
.center{justify-content:center}
.stack{display:flex;flex-direction:column;gap:16px}
.muted{color:var(--ink2);font-size:.85em}
.chip{display:inline-flex;align-items:center;gap:6px;background:var(--paper);border-radius:999px;padding:.15em .8em;font-weight:900;font-variant-numeric:tabular-nums;white-space:nowrap}
.chip svg{width:24px;height:24px}
.titlebar{display:flex;align-items:center;gap:12px;margin-bottom:16px;flex-wrap:wrap}
.titlebar h2{font-size:clamp(22px,4vw,30px)}

/* status bar */
.status{display:flex;align-items:center;gap:10px;flex-wrap:wrap;justify-content:space-between;margin-bottom:10px}
.lvl{display:flex;align-items:center;gap:10px;background:var(--paper);border-radius:18px;padding:6px 12px;min-width:240px;flex:1}
.lvl .badge{font-family:"Mochiy Pop One",sans-serif;background:var(--grape);color:#fff;border-radius:12px;padding:0 .5em;white-space:nowrap}
.xpbar{flex:1;height:14px;background:#E7ECEE;border-radius:99px;overflow:hidden;min-width:80px}
.xpbar i{display:block;height:100%;background:linear-gradient(90deg,var(--grape),#A98BE0);border-radius:99px;transition:width .6s}

/* home */
.hero{display:grid;grid-template-columns:auto 1fr;gap:16px;align-items:center;background:var(--paper);border-radius:28px;padding:16px 18px;margin-bottom:16px}
.partner{width:130px;height:146px}
.hero .title{font-size:clamp(26px,5vw,38px)}

.pool{display:flex;flex-wrap:wrap;gap:4px;justify-content:center;min-height:48px;padding:8px;border-radius:16px;background:#fff;width:100%}

.deal{display:flex;gap:10px;justify-content:center;flex-wrap:wrap}

@media (prefers-reduced-motion:reduce){.scale .needle{transition:none}}
.vs{display:grid;grid-template-columns:1fr auto 1fr;gap:10px;align-items:center}
.wbox{background:#fff;border-radius:18px;padding:16px 8px;text-align:center;font-family:"Mochiy Pop One",sans-serif;font-size:clamp(20px,4.4vw,30px);border:4px solid var(--line)}
.tape{width:100%;max-width:560px;height:auto;display:block;margin:0 auto}
.problem{font-size:1.15em;line-height:2.2;background:#fff;border-radius:18px;padding:12px 16px;border:3px solid var(--line)}

.problem mark.key{background:linear-gradient(transparent 55%,#FFE08A 55%);color:inherit}

.numchip.used{opacity:.3;pointer-events:none}

/* boss */
.arena{background:linear-gradient(#2C2447,#46386E);border-radius:26px;padding:14px 16px;color:#fff;display:grid;grid-template-columns:1fr auto;gap:12px;align-items:center;margin-bottom:12px}

.pop{animation:pop .45s ease-out both}
.pop:nth-child(2){animation-delay:.15s}.pop:nth-child(3){animation-delay:.3s}

/* toast */
#toast{position:fixed;left:50%;bottom:calc(20px + env(safe-area-inset-bottom,0px));transform:translateX(-50%);background:var(--ink);color:#fff;border-radius:18px;padding:.6em 1.1em;font-weight:900;z-index:50;max-width:90vw;text-align:center;box-shadow:0 8px 24px rgba(0,0,0,.2)}

.overlay .card{background:var(--paper);border-radius:28px;padding:24px;max-width:420px;width:100%;text-align:center;display:flex;flex-direction:column;gap:12px;align-items:center}

/* parent */
.panel{background:var(--paper);border-radius:22px;padding:18px;display:flex;flex-direction:column;gap:12px}

.namebox{font-size:28px;padding:.4em .6em;border-radius:16px;border:4px solid var(--line);width:100%;max-width:340px;text-align:center}
</style>

<script>
'use strict';
const app=document.getElementById('app');
const $=s=>document.querySelector(s);

/* ===== 漢字の学年(1〜3年) ===== */
const G1='一右雨円王音下火花貝学気九休玉金空月犬見五口校左三山子四糸字耳七車手十出女小上森人水正生青夕石赤千川先早草足村大男竹中虫町天田土二日入年白八百文木本名目立力林六';

const G3='悪安暗医委意育員院飲運泳駅央横屋温化荷界開階寒感漢館岸起期客究急級宮球去橋業曲局銀区苦具君係軽血決研県庫湖向幸港号根祭皿仕死使始指歯詩次事持式実写者主守取酒受州拾終習集住重宿所暑助昭消商章勝乗植申身神真深進世整昔全相送想息速族他打対待代第題炭短談着注柱丁帳調追定庭笛鉄転都度投豆島湯登等動童農波配倍箱畑発反坂板皮悲美鼻筆氷表秒病品負部服福物平返勉放味命面問役薬由油有遊予羊洋葉陽様落流旅両緑礼列練路和';
const gradeOf=k=>Math.max(...[...k].map(c=>G1.includes(c)?1:G2.includes(c)?2:G3.includes(c)?3:4));

function R(s){return String(s).replace(/@name/g,NAME()).replace(/\{([^|{}]+)\|([^{}]+)\}/g,(m,k,y)=>`<ruby class="g${gradeOf(k)}">${k}<rt>${y}</rt></ruby>`);}
function H(s){return R(s).replace(/\[\[(.+?)\]\]/g,'<mark class="key">$1</mark>').replace(/\(\((.+?)\)\)/g,'<mark class="ask">$1</mark>').replace(/##(\d+)##/g,'<b class="num">$1</b>');}
function P(s){return String(s).replace(/@name/g,NAME()).replace(/<svg[\s\S]*?<\/svg>/g,'').replace(/\{([^|{}]+)\|([^{}]+)\}/g,'$2').replace(/<rt>.*?<\/rt>/g,'').replace(/<[^>]+>/g,' ').replace(/\[\[|\]\]|\(\(|\)\)|##/g,'').replace(/%\d/g,'なに').replace(/\s+/g,' ').trim();}
function SPK(s){return P(s).replace(/(\d+)\s*kg/g,'$1キログラム').replace(/(\d+)\s*g/g,'$1グラム').replace(/(\d+)\s*t(?![a-z])/g,'$1トン').replace(/(\d+)\s*cm/g,'$1センチメートル').replace(/÷/g,' わる ').replace(/×/g,' かける ').replace(/−/g,' ひく ').replace(/\+/g,' たす ').replace(/=/g,' は ').replace(/□/g,' なに ');}
function say(t){try{if(!('speechSynthesis' in window))return;speechSynthesis.cancel();const u=new SpeechSynthesisUtterance(SPK(t));u.lang='ja-JP';u.rate=.85;speechSynthesis.speak(u);}catch(e){}}

function scaleSVG(v,max=1000){
  const cx=130,cy=130,r=112,step=max/100;let s=`<svg viewBox="0 0 260 260" class="scale" role="img" aria-label="はかり">`;
  s+=`<circle cx="${cx}" cy="${cy}" r="126" fill="#DDE6EA" stroke="#1F3A4A" stroke-width="4"/><circle cx="${cx}" cy="${cy}" r="${r+5}" fill="#fff"/>`;
  for(let i=0;i<100;i++){const a=(i*3.6-90)*Math.PI/180,L=i%10==0?18:i%5==0?12:7;
    const x1=cx+r*Math.cos(a),y1=cy+r*Math.sin(a),x2=cx+(r-L)*Math.cos(a),y2=cy+(r-L)*Math.sin(a);
    s+=`<line x1="${x1.toFixed(1)}" y1="${y1.toFixed(1)}" x2="${x2.toFixed(1)}" y2="${y2.toFixed(1)}" stroke="#1F3A4A" stroke-width="${i%10==0?3:i%5==0?2:1.2}"/>`;
    if(i%10==0){const tx=cx+(r-34)*Math.cos(a),ty=cy+(r-34)*Math.sin(a);s+=`<text x="${tx.toFixed(1)}" y="${(ty+6).toFixed(1)}" text-anchor="middle" font-size="${max>1000?15:17}" font-weight="700" fill="#1F3A4A" font-family="sans-serif">${i*step}</text>`;}
  }
  s+=`<text x="${cx}" y="${cy+50}" text-anchor="middle" font-size="14" fill="#4F6B78" font-family="sans-serif">${max/1000}kg はかり (g)</text>`;
  s+=`<g class="needle" style="transform-origin:${cx}px ${cy}px;transform:rotate(${v/max*360}deg)"><line x1="${cx}" y1="${cy+16}" x2="${cx}" y2="${cy-r+4}" stroke="#E4684F" stroke-width="4" stroke-linecap="round"/></g><circle cx="${cx}" cy="${cy}" r="8" fill="#E4684F"/></svg>`;
  return s;
}
/* テープ図 o={total,parts,part,unit,ask:'total'|'part'} または o={a,b,op:'+'|'-',unit,ask} */
function tapeSVG(o){
  const W=520,x0=20,y=50,h=44;let s=`<svg viewBox="0 0 560 150" class="tape" role="img" aria-label="テープ図">`;
  const lab=(x,yy,t,c='#1F3A4A')=>`<text x="${x}" y="${yy}" text-anchor="middle" font-size="20" font-weight="700" fill="${c}" font-family="sans-serif">${t}</text>`;
  const brace=(xa,xb,yy,up)=>`<path d="M${xa} ${yy} v${up?-10:10} H${xb} v${up?10:-10}" stroke="#4F6B78" stroke-width="2.5" fill="none"/>`;
  if(o.parts){const w=W/o.parts;
    for(let i=0;i<o.parts;i++)s+=`<rect x="${x0+i*w}" y="${y}" width="${w}" height="${h}" fill="${i===0?'#FFE08A':'#DCEBFF'}" stroke="#1F3A4A" stroke-width="2"/>`;
    s+=brace(x0,x0+W,y-4,true)+lab(x0+W/2,y-22,o.ask==='total'?'□'+o.unit:o.total+o.unit,o.ask==='total'?'#E4684F':'#1F3A4A');
    s+=brace(x0,x0+w,y+h+4,false)+lab(x0+w/2,y+h+36,o.ask==='part'?'□'+o.unit:o.part+o.unit,o.ask==='part'?'#E4684F':'#1F3A4A');
    s+=lab(x0+W-60,y+h+36,o.parts+'つぶん','#4F6B78');
  }else{const tot=o.a+o.b,wa=W*o.a/tot;
    s+=`<rect x="${x0}" y="${y}" width="${wa}" height="${h}" fill="#DCEBFF" stroke="#1F3A4A" stroke-width="2"/><rect x="${x0+wa}" y="${y}" width="${W-wa}" height="${h}" fill="#FFE08A" stroke="#1F3A4A" stroke-width="2"/>`;
    const T=o.ask==='total'?'□':tot,A=o.ask==='a'?'□':o.a,B=o.ask==='b'?'□':o.b,col=k=>o.ask===k?'#E4684F':'#1F3A4A';
    s+=brace(x0,x0+W,y-4,true)+lab(x0+W/2,y-22,T+o.unit,col('total'));
    s+=lab(x0+wa/2,y+h/2+7,A+o.unit,col('a'))+lab(x0+wa+(W-wa)/2,y+h/2+7,B+o.unit,col('b'));
  }
  return s+'</svg>';
}
function toast(html,ms=2200){const t=$('#toast');t.innerHTML=R(html);t.hidden=false;clearTimeout(toast.t);toast.t=setTimeout(()=>t.hidden=true,ms);}

 ball:{ch:3,op:'×',unit:'g',ask:'ボール {全部|ぜんぶ}の {重|おも}さ',g(){const b=pick([10,20,30,40,50]),c=rand(2,4);return{nums:[b,c],ans:b*c,s:`[[1こ ##${b}##g]]の ボールが ##${c}##こ あります。((ボール {全部|ぜんぶ}の {重|おも}さは {何|なん}g))ですか。`};}},
 sugar:{ch:3,op:'÷',unit:'g',ask:'1ふくろ{分|ぶん}の {重|おも}さ',g(){const b=rand(2,5),q=rand(2,9),a=b*q;return{nums:[a,b],ans:q,s:`さとう ##${a}##gを ##${b}##つの ふくろに [[{同|おな}じ {重|おも}さずつ {分|わ}けます]]。((1ふくろ {何|なん}g))ですか。`};}},
 book:{ch:3,op:'−',unit:'g',ask:'{重|おも}さの ちがい',g(){const a=rand(40,90)*10,b=rand(10,a/10-5)*10;return{nums:[a,b],ans:a-b,s:`{本|ほん}の {重|おも}さは ##${a}##g、ノートの {重|おも}さは ##${b}##gです。(({重|おも}さの [[ちがい]]は {何|なん}g))ですか。`};}},
 tree:{ch:0,op:'+',unit:'{本|ほん}',ask:'あわせた {木|き}の {数|かず}',g(){const a=rand(12,48),b=rand(11,39);return{nums:[a,b],ans:a+b,s:`{公園|こうえん}に さくらの {木|き}が ##${a}##{本|ほん}、もみじの {木|き}が ##${b}##{本|ほん} あります。(([[あわせて]] {何本|なんぼん}))ですか。`};}},
 coin:{ch:0,op:'−',unit:'{円|えん}',ask:'のこった お{金|かね}',g(){const a=rand(5,9)*10+rand(0,9),b=rand(11,a-10);return{nums:[a,b],ans:a-b,s:`##${a}##{円|えん} もって います。##${b}##{円|えん}の ガムを {買|か}いました。((のこりは {何円|なんえん}))ですか。`};}}
};
const REMW=[
 {unit:'だい',up:true,g(){const b=rand(3,6),q=rand(2,7),r=rand(1,b-1),a=b*q+r;return{a,b,ans:q+1,s:`##${a}##{人|にん}が 1だいに ##${b}##{人|にん}ずつ {車|くるま}に {乗|の}ります。(([[{全員|ぜんいん}]]が {乗|の}るには {車|くるま}は {何|なん}だい いります))か。`};}},
 {unit:'{本|ほん}',up:false,g(){const b=rand(3,9),q=rand(2,6),r=rand(1,b-1),a=b*q+r;return{a,b,ans:q,s:`##${a}##cmの テープから ##${b}##cmの リボンを {作|つく}ります。((リボンは {何本|なんぼん} [[できます]]))か。`};}},
 {unit:'はこ',up:true,g(){const b=rand(4,8),q=rand(2,6),r=rand(1,b-1),a=b*q+r;return{a,b,ans:q+1,s:`ケーキが ##${a}##こ あります。1はこに ##${b}##こずつ {入|い}れます。(([[{全部|ぜんぶ}]] {入|い}れるには はこは いくつ いります))か。`};}},
 {unit:'こ',up:false,g(){const b=rand(6,9),q=rand(3,8),r=rand(1,b-1),a=b*q+r;return{a,b,ans:q,s:`##${a}##{円|えん} もって います。1こ ##${b}##{円|えん}の あめは (({何|なん}こ [[{買|か}えます]]))か。`};}}
];
const OPHINT={
 '÷':'「{同|おな}じ {数|かず}ずつ {分|わ}ける」「〜ずつ くばる」「〜ずつ {切|き}る」は わり{算|ざん}(÷)。',
 '×':'「1つ{分|ぶん}の {数|かず}」が「いくつ{分|ぶん}」も ある ときは かけ{算|ざん}(×)。',
 '+':'「あわせて」「{全部|ぜんぶ}で」「{入|い}れると」は たし{算|ざん}(+)。',
 '−':'「のこりは」「つかった」「ちがいは」は ひき{算|ざん}(−)。'
};
const wordPool=maxCh=>Object.keys(WT).filter(k=>WT[k].ch<=maxCh);
function wordQ(maxCh){return i=>{const pool=wordPool(maxCh);const id=pick(pool),T=WT[id],d=T.g();
  const others=shuffle(pool.concat(Object.keys(WT)).filter((k,j,a)=>a.indexOf(k)===j&&k!==id&&WT[k].ask!==T.ask)).slice(0,2).map(k=>WT[k].ask);
  const [x,y]=d.nums,op=T.op;let hint;
  if(op==='÷')hint=`${y}の だんで ${x}に なる ところを さがそう。${dan(y)}`;
  else if(op==='×')hint=x>=10?`${x}を ${y}{回|かい} たそう。${Array(y).fill(x).join(' + ')}`:`${x}の だんを つかおう。${dan(x)}`;
  else hint=`ひっ{算|さん}で {計算|けいさん}しよう。${colHTML(x,y,op==='+'?'+':'−')}`;
  return{type:'word',op,unit:T.unit,ask:T.ask,asks:shuffle([T.ask,...others]),nums:d.nums,answers:[d.ans],s:d.s,speak:d.s,
    hint,explain:`{式|しき}: ${x} ${op} ${y} = ${d.ans}。{答|こた}え ${d.ans}${T.unit}`,text:P(d.s),ansText:`${d.ans}${P(T.unit)}`};};}

/* ===== ラッシュ用 ===== */
const RUSH={
 kuku:{name:'{九九|くく}ラッシュ',sub:'かけ{算|ざん}を 1{分|ぷん}で {何問|なんもん}?',color:'#E4684F',g(){const a=rand(2,9),b=rand(1,9);return{eq:`${a} × ${b}`,ans:a*b};}},
 waru:{name:'わり{算|ざん}ラッシュ',sub:'わり{算|ざん}を 1{分|ぷん}で {何問|なんもん}?',color:'#2F8F6B',g(){const b=rand(2,9),q=rand(1,9);return{eq:`${b*q} ÷ ${b}`,ans:q};}},
 omosa:{name:'{重|おも}さラッシュ',sub:'kgと gの なおし',color:'#C27A2C',g(){const k=rand(1,4),g=pick([0,5,50,80,200,300,500,750]);const n=k*1000+g;const opts=shuffle([n,k*100+g,k*1000+g*10].filter((v,j,a)=>a.indexOf(v)===j));return{eq:kgg(n)+' = ?g',ans:n,opts};}}
};

<script>
/* ===== 時間わり(1日3時間・20日) ===== */
const PLAN=[
 {sec:'s01'},{sec:'s02',boss:'c0'},{sec:'s11'},{sec:'s12'},{sec:'s13'},{sec:'s14',boss:'c1'},{sec:'s21'},{sec:'s22'},{sec:'s23',boss:'c2'},
 {review:['c0','c1','c2'],title:'ふくしゅうの {日|ひ}'},
 {sec:'s31'},{sec:'s32'},{sec:'s33'},{sec:'s34',boss:'c3'},{sec:'s41'},{sec:'s42'},{sec:'s43',boss:'c4'},
 {review:['c1','c2'],title:'わり{算|ざん} ふくしゅう'},{review:['c3','c4'],title:'{重|おも}さと {文章|ぶんしょう}{問題|もんだい}'},{review:['c0','c1','c2','c3','c4'],boss:'fin',title:'さいごの {日|ひ}'}
];
const chIdx=id=>CH.findIndex(c=>c.id===id);
const secsOf=chs=>chs.flatMap(c=>CH[chIdx(c)].secs);
function dayTitle(d){const p=PLAN[d-1];return p.sec?SEC[p.sec].title:p.title;}
function blocks(d){const p=PLAN[d-1],L=[];
 if(p.sec){const upto=ALLSEC.slice(0,ALLSEC.indexOf(p.sec)+1),ci=chIdx(SEC[p.sec].ch);
  L.push({k:'book',sec:p.sec,min:25,name:'{教科書|きょうかしょ}を {読|よ}む',desc:SEC[p.sec].title});
  L.push({k:'drill',secs:[p.sec],n:10,min:25,name:'{問題集|もんだいしゅう} 1',desc:'きょう {学|まな}んだ ところ 10{問|もん}'});
  L.push({k:'rest',min:10,name:'{休|やす}けい',desc:'{目|め}と からだを {休|やす}めよう'});
  L.push({k:'drill',secs:upto.slice(-3),n:10,min:25,name:'{問題集|もんだいしゅう} 2',desc:'まぜまぜ ドリル 10{問|もん}'});
  L.push({k:'rush',game:ci===0?'kuku':ci<=2?'waru':'omosa',min:15,name:'ゲーム',desc:P(RUSH[ci===0?'kuku':ci<=2?'waru':'omosa'].name)});
  L.push({k:'rest',min:10,name:'{休|やす}けい',desc:'{水|みず}を のもう'});
  L.push({k:'word',maxCh:ci,n:5,min:25,name:'{文章|ぶんしょう}{問題|もんだい} トレーニング',desc:'4つの ステップで 5{問|もん}'});
  L.push({k:'review',secs:upto,n:10,min:25,name:'ふくしゅう',desc:'まちがえた {問題|もんだい}に もう{一度|いちど}'});
  L.push(p.boss?{k:'boss',boss:p.boss,min:20,name:'ボスと たたかう',desc:BOSSES[p.boss].name}:{k:'drill',secs:[p.sec],n:5,min:20,test:true,name:'まとめテスト',desc:'5{問|もん}'});
 }else{const all=secsOf(p.review),ci=Math.max(...p.review.map(chIdx));
  L.push({k:'drill',secs:secsOf([p.review[0]]),n:10,min:25,name:'ふくしゅう ドリル 1',desc:P(CH[chIdx(p.review[0])].title)});
  L.push({k:'drill',secs:secsOf([p.review[p.review.length-1]]),n:10,min:25,name:'ふくしゅう ドリル 2',desc:P(CH[chIdx(p.review[p.review.length-1])].title)});
  L.push({k:'rest',min:10,name:'{休|やす}けい',desc:'{目|め}と からだを {休|やす}めよう'});
  L.push({k:'word',maxCh:ci,n:5,min:25,name:'{文章|ぶんしょう}{問題|もんだい} トレーニング',desc:'5{問|もん}'});
  L.push({k:'rush',game:ci>=3?'omosa':'waru',min:15,name:'ゲーム',desc:P(RUSH[ci>=3?'omosa':'waru'].name)});
  L.push({k:'rest',min:10,name:'{休|やす}けい',desc:'{水|みず}を のもう'});
  L.push({k:'review',secs:all,n:10,min:25,name:'ふくしゅう',desc:'まちがえた {問題|もんだい}に もう{一度|いちど}'});
  L.push({k:'drill',secs:all,n:10,min:25,name:'まぜまぜ ドリル',desc:'10{問|もん}'});
  L.push(p.boss?{k:'boss',boss:p.boss,min:20,name:'{大|だい}ボスと たたかう',desc:BOSSES[p.boss].name}:{k:'drill',secs:all,n:5,min:20,test:true,name:'まとめテスト',desc:'5{問|もん}'});
 }
 return L;}
const dayDone=d=>(S.plan[d]||[]);
const dayCount=d=>dayDone(d).filter(Boolean).length;
const dayOpen=d=>d===1||dayCount(d-1)>=5;
function curDay(){for(let d=1;d<=20;d++){if(dayCount(d)<9&&dayOpen(d))return d;}return 20;}

/* ===== レベル・コイン ===== */
const TITLES=['{見習|みなら}い たんけん{家|か}','かけ{出|だ}し たんけん{家|か}','{算数|さんすう} たんけん{家|か}','なぞとき{名人|めいじん}','{数|かず}の はかせ','{算数|さんすう}マスター','でんせつの たんけん{家|か}'];
function lvInfo(xp){let l=1,need=100,rest=xp;while(rest>=need){rest-=need;l++;need=100+50*(l-1);}return{l,rest,need,title:TITLES[Math.min(TITLES.length-1,Math.floor((l-1)/3))]};}
function gain(xp,coins){const before=lvInfo(S.xp).l;S.xp+=xp;S.coins+=coins;save();const after=lvInfo(S.xp).l;if(after>before){SND.lvl();levelUp(after);}}
function levelUp(l){$$('.overlay').forEach(x=>x.remove());const o=document.createElement('div');o.className='overlay';o.innerHTML=`<div class="card pop"><div style="width:140px">${OWL()}</div><h2>レベル アップ!</h2><p class="bigeq">Lv.${l}</p><p>${R(lvInfo(S.xp).title)}</p><button class="btn primary">やったね</button></div>`;document.body.appendChild(o);o.querySelector('button').onclick=()=>o.remove();}

/* ===== 勉強時間 ===== */
let MODE='menu',tick=0;
setInterval(()=>{if(MODE==='study'&&document.visibilityState==='visible'){const d=today();S.time[d]=(S.time[d]||0)+1;if(++tick%15===0)save();const c=$('#clk');if(c)c.textContent=fmtT(S.time[d]);}},1000);
const fmtT=s=>`${Math.floor(s/3600)}:${String(Math.floor(s%3600/60)).padStart(2,'0')}`;
const jpT=s=>{const h=Math.floor(s/3600),m=Math.floor(s%3600/60);return (h?h+'{時間|じかん}':'')+m+'{分|ふん}';};

/* ===== 共通パーツ ===== */
function statusBar(){const v=lvInfo(S.xp);return `<div class="status"><div class="lvl"><span class="badge">Lv.${v.l}</span><div style="flex:1"><div style="font-size:.75em;font-weight:900">${R(v.title)}</div><div class="xpbar"><i style="width:${v.rest/v.need*100}%"></i></div></div></div><span class="chip">${COIN} ${S.coins}</span></div>`;}
function go(fn){MODE='menu';try{speechSynthesis.cancel();}catch(e){}fn();window.scrollTo(0,0);}
const back=(label='もどる')=>`<button class="btn ghost" data-back>← ${R(label)}</button>`;
function bindBack(fn){$$('[data-back]').forEach(b=>b.onclick=()=>go(fn));}
const esc=s=>String(s).replace(/[&<>"]/g,c=>({'&':'&amp;','<':'&lt;','>':'&gt;','"':'&quot;'}[c]));

/* ===== なまえ ===== */
function nameScreen(after){
 app.innerHTML=`<div class="result" style="margin-top:20px"><div style="width:150px">${OWL()}</div><h2>はじめまして! ぼくは ホーちゃん</h2><p>きみの なまえを おしえてね。</p><input id="nm" class="namebox" maxlength="10" autocomplete="off" value="${esc(S.name)}" aria-label="なまえ"><button class="btn primary" id="ok">けってい</button></div>`;
 $('#ok').onclick=()=>{const v=$('#nm').value.trim();if(!v){$('#nm').focus();return;}S.name=esc(v);save();SND.fan();(after||home)();};
}

/* ===== ホーム ===== */
const CHEER=['きょうも いっしょに たんけん しよう!','まちがえても だいじょうぶ。まちがいは つよく なる チャンス!','こまったら「よみあげ」ボタンで {問題|もんだい}を きいてね。','コインを ためて ぼくを きせかえてね!','{休|やす}けいも だいじな {勉強|べんきょう}の {一|ひと}つだよ。'];
function home(){
 const d=curDay(),t=S.time[today()]||0;
 app.innerHTML=statusBar()+`
 <div class="hero"><div class="partner">${OWL()}</div><div><h1 class="title disp">さんすう<span>たんけん</span></h1><div class="say">${R(pick(CHEER).replace('たんけん しよう','たんけん しよう、@nameさん'))}</div></div></div>
 <button class="today" id="today"><div><div class="muted" style="color:#C9DCE3">きょうの {時間|じかん}わり</div><div class="disp">${d}{日目|にちめ}: ${R(dayTitle(d))}</div><div style="font-size:.8em">{勉強|べんきょう} ${R(jpT(t))} / 3{時間|じかん}</div><div class="tbar"><i style="width:${Math.min(100,t/108)}%"></i></div></div><span class="go">はじめる</span></button>
 <div class="menu">
  ${mb('map','#3E9AB5','たからの {地図|ちず}','20{日間|にちかん}の ぼうけん')}
  ${mb('book','#3E6FB5','{教科書|きょうかしょ}','{読|よ}んで さわって {学|まな}ぶ')}
  ${mb('pen','#2F8F6B','{問題集|もんだいしゅう}','すきな ところを れんしゅう')}
  ${mb('game','#E4684F','ゲーム','{九九|くく}・わり{算|ざん}・{重|おも}さ ラッシュ')}
  ${mb('boss','#7A5BB5','ボスバトル','{章|しょう}の ボスを たおせ')}
  ${mb('review','#C27A2C','ふくしゅう',`まちがえた {問題|もんだい} ${S.miss.length}{問|もん}`)}
  ${mb('shop','#F4B63A','ショップ','ホーちゃんを きせかえ')}
  ${mb('zukan','#8C6A4A','ずかん','あつめた メダル')}
 </div>
 <div class="row" style="margin-top:18px"><button class="btn ghost" id="parent">おうちの{方|かた}へ・せってい</button></div>`;
 $('#today').onclick=()=>go(()=>dayScreen(d));
 const act={map:mapScreen,book:bookLib,pen:drillLib,game:gameMenu,boss:bossMenu,review:()=>startReview(null),shop,zukan};
 $$('[data-m]').forEach(b=>b.onclick=()=>{SND.tap();go(act[b.dataset.m]);});
 $('#parent').onclick=()=>go(parent);
}
function mb(id,col,t,s){return `<button class="mbtn" data-m="${id}" style="--ac:${col}"><span class="ic">${IC[id]}</span><span><b>${R(t)}</b><small>${R(s)}</small></span></button>`;}
</script>
<script>
/* ===== たからの地図 ===== */
function mapScreen(){
 const cd=curDay();
 app.innerHTML=`<div class="titlebar">${back()}<h2>たからの {地図|ちず}</h2><span class="muted">1{日|にち} 3{時間|じかん}・20{日|にち}で ゴール</span></div>
 <div class="map">${PLAN.map((p,i)=>{const d=i+1,open=dayOpen(d),c=dayCount(d),done=c>=9;
  return `<button class="stone ${done?'done':''} ${d===cd?'now':''} ${open?'':'lock'} ${p.boss?'boss':''}" data-d="${d}" ${open?'':'disabled'}><span class="n">${d}</span><small>${open?R(dayTitle(d)):'?'}</small><small>${c}/9</small></button>`;}).join('')}</div>
 <p class="muted" style="margin-top:10px">{時間|じかん}わりを 5つ いじょう おわらせると、つぎの {日|ひ}が ひらくよ。むらさきの {日|ひ}は ボスの {日|ひ}。</p>`;
 bindBack(home);
 $$('.stone').forEach(b=>b.onclick=()=>go(()=>dayScreen(+b.dataset.d)));
}

/* ===== きょうの時間わり ===== */
function dayScreen(d){
 const L=blocks(d),dn=dayDone(d),t=S.time[today()]||0;let clock=0;
 const nextI=L.findIndex((_,i)=>!dn[i]);
 app.innerHTML=`<div class="titlebar">${back()}<h2>${d}{日目|にちめ}の {時間|じかん}わり</h2></div>
 <div class="clock"><div><div class="muted">きょうの {勉強|べんきょう}{時間|じかん}</div><div class="big"><span id="clk">${fmtT(t)}</span> / 3:00</div></div><div style="width:84px">${OWL()}</div></div>
 <div class="sched">${L.map((b,i)=>{const st=clock;clock+=b.min;const done=dn[i];
  return `<button class="blk ${b.k==='rest'?'rest':''} ${done?'done':''} ${i===nextI?'next':''}" data-i="${i}"><span class="tm"><b>${b.min}</b>{分|ふん}</span><span><span class="nm">${R(b.name)}</span><span class="ds">${R(b.desc||'')}</span></span><span class="ck">${done?'✓':i+1}</span></button>`;}).join('')}</div>
 <p class="muted" style="margin-top:10px">{上|うえ}から じゅんばんに すすめよう。{休|やす}けいも ちゃんと とってね。</p>`;
 bindBack(home);
 $$('.blk').forEach(b=>b.onclick=()=>{SND.tap();const i=+b.dataset.i;runBlock(d,i,L[i]);});
}
function finishBlock(d,i){if(!S.plan[d])S.plan[d]=[];const first=!S.plan[d][i];S.plan[d][i]=true;save();
 if(first){gain(30,20);if(dayCount(d)===9){gain(100,100);setTimeout(()=>toast(`${d}{日目|にちめ} ぜんぶ クリア! +100コイン`,3000),400);}}
 go(()=>dayScreen(d));}
function runBlock(d,i,b){const done=()=>finishBlock(d,i);
 if(b.k==='book')go(()=>bookSec(b.sec,0,done,()=>dayScreen(d)));
 else if(b.k==='rest')go(()=>rest(b.min,done));
 else if(b.k==='drill')go(()=>runSet({title:b.name,qs:makeQs(b.secs,b.n),color:'#2F8F6B',onDone:done,back:()=>dayScreen(d)}));
 else if(b.k==='word')go(()=>runSet({title:b.name,qs:Array.from({length:b.n},(_,j)=>Object.assign(wordQ(b.maxCh)(j),{sec:'word'})),color:'#7A5BB5',onDone:done,back:()=>dayScreen(d)}));
 else if(b.k==='review')go(()=>startReview(b.secs,b.n,done,()=>dayScreen(d)));
 else if(b.k==='rush')go(()=>rushGame(b.game,done,()=>dayScreen(d)));
 else if(b.k==='boss')go(()=>bossBattle(b.boss,done,()=>dayScreen(d)));
}

 if(ok){Q.score++;Q.combo++;S.bestCombo=Math.max(S.bestCombo||0,Q.combo);const c=3+(Q.combo>=3?2:0);Q.coins+=c;Q.xp+=10;gain(10,c);SND.good();

 }else{Q.combo=0;SND.bad();

 }

  ・ホームの「きょうの時間わり」を上から進めると、1日約3時間（教科書25分→問題集25分→休けい10分→問題集25分→ゲーム15分→休けい10分→文章問題25分→ふくしゅう25分→まとめテスト／ボス20分）になります。<br>
  ・20日間の「たからの地図」で、教科書16節とボス戦を順番に進めます。時間わりを5つ以上終えると翌日分が開きます。<br>
  ・教科書は読むだけでなく、りんごを配る・はかりに物をのせる・九九表をさわる等の操作とクイズで進みます。クイズに正解しないと次のページに進めません。<br>
  ・間違えた問題は自動で「ふくしゅう」に入り、正解すると消えます。<br>
  ・勉強時間は、教科書・問題集・ゲームの画面を開いている間だけ数えています（休けい中は数えません）。<br>
  ・記録はこのiPadのブラウザ内にだけ保存されます。</p></div>
  <div class="panel"><b>設定</b>
   <div><div class="muted">ふりがな</div><div class="seg" id="furi">${[['all','すべての漢字'],['2','2・3年の漢字（おすすめ）'],['3','3年の漢字だけ'],['none','なし']].map(([v,t])=>`<button data-v="${v}" class="${S.furi===v?'on':''}">${t}</button>`).join('')}</div></div>
   <div><div class="muted">効果音</div><div class="seg" id="snd"><button data-v="1" class="${S.sound?'on':''}">オン</button><button data-v="0" class="${S.sound?'':'on'}">オフ</button></div></div>
   <div class="row"><span class="muted">名前: ${S.name}</span><button class="btn small" id="rename">名前を変える</button></div></div>
  <div class="panel"><b>勉強時間（1日の目標 3時間）</b>${days.length?`<div class="tbl"><table><thead><tr><th>日付</th><th>勉強時間</th><th>達成</th></tr></thead><tbody>${days.map(d=>`<tr><td>${d}</td><td>${P(jpT(S.time[d]))}</td><td>${Math.round(S.time[d]/108)}%</td></tr>`).join('')}</tbody></table></div>`:'<p class="muted">まだ記録がありません。</p>'}</div>
  <div class="panel"><b>20日プランの進み具合</b><div class="tbl"><table><thead><tr><th>日</th><th>内容</th><th>完了</th></tr></thead><tbody>${PLAN.map((p,i)=>`<tr><td>${i+1}日目</td><td>${P(dayTitle(i+1))}</td><td>${dayCount(i+1)} / 9</td></tr>`).join('')}</tbody></table></div></div>
  <div class="panel"><b>単元ごとの記録</b><div class="tbl"><table><thead><tr><th>単元</th><th>教科書</th><th>正解 / 解いた数</th></tr></thead><tbody>${secRows}<tr><td>文章問題（4ステップ）</td><td>—</td><td>${w.ok} / ${w.n}</td></tr></tbody></table></div>
   <p class="muted">ボス撃破: ${Object.keys(S.boss).length} / 6 ・ レベル ${lvInfo(S.xp).l} ・ コイン ${S.coins}</p></div>
  <div class="panel"><b>まちがえた問題（新しい順）</b>${S.miss.length?`<div class="tbl"><table><thead><tr><th>日付</th><th>問題</th><th>正しい答え</th><th>入力</th></tr></thead><tbody>${S.miss.slice(0,40).map(m=>`<tr><td>${m.d||''}</td><td style="white-space:normal;min-width:220px">${esc(m.text)}</td><td>${esc(m.ansText)}</td><td>${esc(m.u||'')}</td></tr>`).join('')}</tbody></table></div>`:'<p class="muted">ありません。</p>'}</div>
  <div class="panel"><b>記録のリセット</b><p class="muted">名前以外のすべての記録（コイン・レベル・進み具合）を消します。</p><div class="row"><button class="btn red" id="rst">リセットする</button><span id="rstc"></span></div></div>
 </div>`;
 bindBack(home);
 $$('#furi button').forEach(b=>b.onclick=()=>{S.furi=b.dataset.v;document.body.dataset.furi=S.furi;save();parent();});
 $$('#snd button').forEach(b=>b.onclick=()=>{S.sound=b.dataset.v==='1';save();parent();});
 $('#rename').onclick=()=>nameScreen(parent);
 $('#rst').onclick=()=>{$('#rstc').innerHTML='<button class="btn small red" id="y">本当に消す</button> <button class="btn small ghost" id="n">やめる</button>';
  $('#y').onclick=()=>{const n=S.name,f=S.furi;S=blank();S.name=n;S.furi=f;save();parent();};$('#n').onclick=()=>{$('#rstc').innerHTML='';};};
}
/*ENDADULT*/

/* ふりがな記法が そのまま 出ないように 自動で 変かん */
function fixRuby(root){const w=document.createTreeWalker(root,NodeFilter.SHOW_TEXT),list=[];let n;
 while((n=w.nextNode()))if(/\{[^|{}]+\|[^{}]+\}/.test(n.nodeValue)&&!n.parentNode.closest('script,style,svg'))list.push(n);
 list.forEach(t=>{const sp=document.createElement('span');sp.innerHTML=R(esc(t.nodeValue).replace(/&amp;/g,'&'));t.replaceWith(...sp.childNodes);});}
new MutationObserver(()=>fixRuby(app)).observe(app,{childList:true,subtree:true});

/* 起動 */
if(!S.name)nameScreen(home);else home();
</script>
